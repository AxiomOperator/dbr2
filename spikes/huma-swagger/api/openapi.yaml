components:
  schemas:
    Application:
      additionalProperties: false
      properties:
        containers:
          description: Number of containers.
          examples:
            - 3
          format: int64
          minimum: 0
          type: integer
        host:
          description: Docker host the application runs on.
          examples:
            - docker-01
          type: string
        id:
          description: Application ID.
          examples:
            - 0b8f3c2e-3f7a-4b53-9c1e-1f2a3b4c5d6e
          format: uuid
          type: string
        last_backup:
          description: Time of the last successful backup, if any.
          format: date-time
          type: string
        name:
          description: Compose project or stack name.
          examples:
            - wiki
          type: string
      required:
        - id
        - name
        - host
        - containers
      type: object
    Backup:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/api/schemas/Backup.json
          format: uri
          readOnly: true
          type: string
        application_id:
          description: Application being backed up.
          format: uuid
          type: string
        created_at:
          description: When the run was requested.
          format: date-time
          type: string
        id:
          description: Backup run ID.
          examples:
            - 7d1e8a90-5c4b-4f1e-8a2d-3b4c5d6e7f80
          format: uuid
          type: string
        status:
          description: Run status.
          enum:
            - queued
            - running
            - succeeded
            - failed
          examples:
            - queued
          type: string
      required:
        - id
        - application_id
        - status
        - created_at
      type: object
    CreateBackupBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/api/schemas/CreateBackupBody.json
          format: uri
          readOnly: true
          type: string
        application_id:
          description: Application to back up.
          examples:
            - 0b8f3c2e-3f7a-4b53-9c1e-1f2a3b4c5d6e
          format: uuid
          type: string
        include_volumes:
          default: true
          description: Back up named volumes and bind mounts.
          type: boolean
        reason:
          description: Free-text reason recorded in the audit log.
          examples:
            - pre-upgrade snapshot
          maxLength: 500
          type: string
      required:
        - application_id
      type: object
    ErrorDetail:
      additionalProperties: false
      properties:
        location:
          description: Where the error occurred, e.g. 'body.items[3].tags' or 'path.thing-id'
          type: string
        message:
          description: Error message text
          type: string
        value:
          description: The value at the given location
      type: object
    ErrorModel:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/api/schemas/ErrorModel.json
          format: uri
          readOnly: true
          type: string
        detail:
          description: A human-readable explanation specific to this occurrence of the problem.
          examples:
            - Property foo is required but is missing.
          type: string
        errors:
          description: Optional list of individual error details
          items:
            $ref: "#/components/schemas/ErrorDetail"
          type:
            - array
            - "null"
        instance:
          description: A URI reference that identifies the specific occurrence of the problem.
          examples:
            - https://example.com/error-log/abc123
          format: uri
          type: string
        status:
          description: HTTP status code
          examples:
            - 400
          format: int64
          type: integer
        title:
          description: A short, human-readable summary of the problem type. This value should not change between occurrences of the error.
          examples:
            - Bad Request
          type: string
        type:
          default: about:blank
          description: A URI reference to human-readable documentation for the error.
          examples:
            - https://example.com/errors/example
          format: uri
          type: string
      type: object
    ListApplicationsOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/api/schemas/ListApplicationsOutputBody.json
          format: uri
          readOnly: true
          type: string
        items:
          description: Applications visible to the caller.
          items:
            $ref: "#/components/schemas/Application"
          type:
            - array
            - "null"
        next_cursor:
          description: Cursor for the next page; absent on the last page.
          type: string
      required:
        - items
      type: object
    VersionOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/api/schemas/VersionOutputBody.json
          format: uri
          readOnly: true
          type: string
        components:
          additionalProperties:
            type: string
          description: Version of each component, keyed by component name.
          type: object
        platform:
          description: DBR² platform release (MAJOR.MINOR.BUGFIX.BUILD).
          examples:
            - 0.1.0.42
          type: string
      required:
        - platform
        - components
      type: object
  securitySchemes:
    bearerAuth:
      bearerFormat: JWT
      description: DBR² access token. Paste it into Authorize (without the `Bearer ` prefix).
      scheme: bearer
      type: http
info:
  description: |-
    Docker Backup, Recovery & Restore (DBR²) control-plane API.

    All operations require a bearer token (or a browser session). Requests made from this page run with your own permissions.
  title: DBR² API
  version: 0.1.0.0
openapi: 3.1.0
paths:
  /api/v1/applications:
    get:
      description: Lists the Docker applications discovered by the agents that the caller is allowed to see. Results are paginated with an opaque cursor.
      operationId: list-applications
      parameters:
        - description: Maximum number of items to return.
          explode: false
          in: query
          name: limit
          schema:
            default: 50
            description: Maximum number of items to return.
            format: int64
            maximum: 100
            minimum: 1
            type: integer
        - description: Opaque cursor from a previous response's next_cursor.
          explode: false
          in: query
          name: cursor
          schema:
            description: Opaque cursor from a previous response's next_cursor.
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListApplicationsOutputBody"
          description: OK
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unauthorized
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Forbidden
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
      summary: List applications
      tags:
        - Applications
      x-dbr2-permission: applications:read
  /api/v1/backups:
    post:
      description: Queues an on-demand backup run for an application. The run executes asynchronously as a Temporal workflow; poll the returned backup to follow progress.
      operationId: create-backup
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBackupBody"
        required: true
      responses:
        "202":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Backup"
          description: Accepted
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Bad Request
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unauthorized
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Forbidden
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
      summary: Start a backup
      tags:
        - Backups
      x-dbr2-permission: backups:create
  /api/v1/version:
    get:
      description: Returns the DBR² platform version and the version of each component (ADR-0015). The `api` component version is also the OpenAPI `info.version`.
      operationId: get-version
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VersionOutputBody"
          description: OK
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unauthorized
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Forbidden
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
      summary: Get platform and component versions
      tags:
        - System
security:
  - bearerAuth: []
tags:
  - description: Platform and component metadata.
    name: System
  - description: Discovered Docker applications.
    name: Applications
  - description: Backup runs.
    name: Backups
