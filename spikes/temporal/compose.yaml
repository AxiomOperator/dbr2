# DBR² Temporal spike: PostgreSQL 18 + Temporal server + admin-tools schema job + UI.
# Pattern: temporalio/samples-server/compose (auto-setup image is no longer published past 1.29.x).
name: dbr2spike-temporal

x-temporal-db-env: &temporal-db-env
  DB: postgres12            # SQL plugin name; covers PG12+ (tested here on PG18)
  DB_PORT: "5432"
  POSTGRES_SEEDS: postgres
  POSTGRES_USER: temporal
  POSTGRES_PWD: ${TEMPORAL_DB_PASSWORD}
  DBNAME: temporal
  VISIBILITY_DBNAME: temporal_visibility

services:
  postgres:
    image: postgres:18.6-trixie
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TEMPORAL_DB_PASSWORD: ${TEMPORAL_DB_PASSWORD}
      DBR2_DB_PASSWORD: ${DBR2_DB_PASSWORD}
    volumes:
      # PG18 images: mount the parent dir /var/lib/postgresql (PGDATA=/var/lib/postgresql/18/docker)
      - pgdata:/var/lib/postgresql
      - ./initdb:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:15432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres && psql -U postgres -tAc \"select 1 from pg_database where datname='temporal_visibility'\" | grep -q 1"]
      interval: 3s
      timeout: 3s
      retries: 60

  temporal-schema:
    image: temporalio/admin-tools:1.32.0
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      <<: *temporal-db-env
      SQL_PASSWORD: ${TEMPORAL_DB_PASSWORD}
    volumes:
      - ./scripts:/scripts:ro
    entrypoint: ["/bin/sh", "/scripts/setup-temporal-schema.sh"]
    restart: "no"

  temporal:
    image: temporalio/server:1.32.0
    depends_on:
      temporal-schema: { condition: service_completed_successfully }
    environment:
      <<: *temporal-db-env
      BIND_ON_IP: 0.0.0.0
      DYNAMIC_CONFIG_FILE_PATH: config/dynamicconfig/development-sql.yaml
    volumes:
      - ./dynamicconfig:/etc/temporal/config/dynamicconfig:ro
    ports:
      - "127.0.0.1:17233:7233"
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "7233"]
      interval: 3s
      timeout: 3s
      start_period: 20s
      retries: 60

  temporal-create-namespace:
    image: temporalio/admin-tools:1.32.0
    depends_on:
      temporal: { condition: service_healthy }
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      NAMESPACE: dbr2
    volumes:
      - ./scripts:/scripts:ro
    entrypoint: ["/bin/sh", "/scripts/create-namespace.sh"]
    restart: "no"

  temporal-admin-tools:     # long-running shell for `docker compose exec temporal-admin-tools temporal ...`
    image: temporalio/admin-tools:1.32.0
    depends_on:
      temporal: { condition: service_healthy }
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CLI_ADDRESS: temporal:7233
    entrypoint: ["sleep", "infinity"]

  temporal-ui:
    image: temporalio/ui:2.54.1
    depends_on:
      temporal: { condition: service_healthy }
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_DEFAULT_NAMESPACE: dbr2
      TEMPORAL_CORS_ORIGINS: http://127.0.0.1:18233
    ports:
      - "127.0.0.1:18233:8080"

volumes:
  pgdata: {}
