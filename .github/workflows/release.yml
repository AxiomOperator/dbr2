# SPDX-License-Identifier: Apache-2.0
#
# Platform release (ADR-0015). Manual, main only.
#  1. Compute every component's full version (<VERSION>.<run_number>; BUILD 0
#     for contract components) and the platform version.
#  2. Move [Unreleased] changelog entries under the release heading
#     (scripts/release/finalize-changelogs.sh) and write release-manifest.json.
#  3. Commit (DCO signed-off) as github-actions[bot], tag v<platform> and
#     <component>/v<version> for released components, push.
#  4. Build Go binaries, the agent RPM, checksums and SBOMs; create the
#     GitHub Release.
#  5. Build, sign and push the container images (images.yml) and attach their SBOMs.
# With dry_run, steps 3-5 only upload the would-be commit and artifacts.
name: Release

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Dry run (no commit, tags, release or images)
        type: boolean
        default: false

concurrency:
  group: release
  cancel-in-progress: false

permissions: {}

jobs:
  release:
    name: Version, changelogs, tag and GitHub Release
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # release commit, tags and GitHub Release
      id-token: write # cosign keyless signature of the checksums
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      platform: ${{ steps.version.outputs.platform }}
    env:
      BUILD: ${{ github.run_number }}
      DRY_RUN: ${{ inputs.dry_run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Compute versions
        id: version
        run: |
          source scripts/ci/lib/components.sh
          platform=$(full_version platform "${BUILD:?}")
          if git rev-parse -q --verify "refs/tags/v$platform" >/dev/null; then
            echo "::error::tag v$platform already exists"; exit 1
          fi
          echo "platform=$platform" >> "$GITHUB_OUTPUT"
          echo "tag=v$platform" >> "$GITHUB_OUTPUT"
          {
            echo "## Release v$platform"
            echo
            echo "| Component | Version |"
            echo "|---|---|"
            for n in $(component_names); do echo "| \`$n\` | $(full_version "$n" "$BUILD") |"; done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Finalize changelogs and write release-manifest.json
        run: |
          mkdir -p dist
          scripts/release/finalize-changelogs.sh --build "$BUILD" | tee dist/released.txt
          if [[ ! -s dist/released.txt ]]; then
            echo "::error::no changelog has [Unreleased] entries; nothing to release"
            exit 1
          fi
          scripts/release/release-manifest.sh --build "$BUILD" --changed dist/released.txt \
            --base-commit "$GITHUB_SHA" > release-manifest.json
          cp release-manifest.json dist/
          git --no-pager diff --stat

      - name: Commit (signed off) and tag
        env:
          PLATFORM: ${{ steps.version.outputs.platform }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- CHANGELOG.md '*CHANGELOG.md' release-manifest.json
          git commit -s -m "release: v$PLATFORM" -m "Finalize changelogs and release-manifest.json (ADR-0015)."
          git tag -a "v$PLATFORM" -m "DBR² platform v$PLATFORM"
          while read -r name version; do
            [[ -z $name || $name == platform ]] && continue
            t="$name/v$version"
            if git rev-parse -q --verify "refs/tags/$t" >/dev/null; then
              echo "::warning::tag $t already exists; not re-tagged"
              continue
            fi
            git tag -a "$t" -m "DBR² $name v$version"
          done < dist/released.txt
          git show --stat HEAD
          git tag --points-at HEAD
          git format-patch -1 --stdout HEAD > dist/release-commit.patch

      - name: Push commit and tags
        if: inputs.dry_run == false
        env:
          PLATFORM: ${{ steps.version.outputs.platform }}
        run: |
          git push origin "HEAD:refs/heads/main"
          mapfile -t tags < <(git tag --points-at HEAD | sed 's|^|refs/tags/|')
          git push origin "${tags[@]}"

      - name: Build Go binaries
        run: |
          make build BUILD="$BUILD"
          cp bin/dbr2-server bin/dbr2-worker bin/dbr2-agent bin/dbr2-reposerver bin/dbr2 dist/
          for b in dbr2-server dbr2-worker dbr2-agent dbr2-reposerver dbr2; do
            mv "dist/$b" "dist/$b-linux-amd64"
          done

      - name: Build the agent RPM
        run: make rpm BUILD="$BUILD"

      - name: Install syft
        id: syft
        uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2

      - name: SBOMs and checksums
        env:
          SYFT: ${{ steps.syft.outputs.cmd }}
        run: |
          cd dist
          for f in *-linux-amd64; do
            "$SYFT" scan "file:$f" -o "spdx-json=$f.spdx.json"
          done
          sha256sum -- *-linux-amd64 *.rpm *.spdx.json release-manifest.json > SHA256SUMS
          cat SHA256SUMS

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: inputs.dry_run == false

      - name: Sign checksums (keyless)
        if: inputs.dry_run == false
        run: cosign sign-blob --yes --bundle dist/SHA256SUMS.sigstore.json dist/SHA256SUMS

      - name: Release notes
        env:
          PLATFORM: ${{ steps.version.outputs.platform }}
        run: |
          awk -v v="$PLATFORM" '
            $0 ~ "^## \\[" v "\\]" { on = 1; next }
            on && /^## / { exit }
            on { print }' CHANGELOG.md > dist/NOTES.md
          {
            echo
            echo "Component versions are pinned in \`release-manifest.json\`."
            echo "Verify checksums: \`cosign verify-blob --bundle SHA256SUMS.sigstore.json --certificate-identity-regexp '^https://github.com/${GITHUB_REPOSITORY}/' --certificate-oidc-issuer https://token.actions.githubusercontent.com SHA256SUMS\`"
          } >> dist/NOTES.md
          cat dist/NOTES.md

      - name: Create GitHub Release
        if: inputs.dry_run == false
        env:
          GH_TOKEN: ${{ github.token }}
          PLATFORM: ${{ steps.version.outputs.platform }}
        run: |
          cd dist
          gh release create "v$PLATFORM" --verify-tag --title "DBR² v$PLATFORM" --notes-file NOTES.md \
            -- *-linux-amd64 *.rpm *.spdx.json release-manifest.json SHA256SUMS SHA256SUMS.sigstore.json

      - name: Upload dry-run output
        if: inputs.dry_run
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-dry-run
          path: dist/
          retention-days: 7

  images:
    name: Container images
    needs: release
    if: inputs.dry_run == false
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: ./.github/workflows/images.yml
    with:
      ref: ${{ needs.release.outputs.tag }}
      build: ${{ github.run_number }}

  image-sboms:
    name: Attach image SBOMs to the release
    needs: [release, images]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: sbom-*
          path: sboms
          merge-multiple: true
      - name: Upload SBOMs
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release.outputs.tag }}
        run: gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber -- sboms/*
