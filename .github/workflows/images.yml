# SPDX-License-Identifier: Apache-2.0
#
# Build, SBOM, push and sign the DBR² container images (ADR-0015 tags).
#   ghcr.io/axiomoperator/<image>:<VERSION>.<BUILD>, :<VERSION>, :<MAJOR.MINOR>
#   plus :edge for pushes to main.
# Signatures and SBOM attestations use cosign keyless signing (GitHub OIDC).
name: Images

on:
  push:
    branches: [main]
  workflow_call:
    inputs:
      ref:
        description: Git ref (tag or SHA) to build; defaults to the triggering commit
        type: string
        required: false
        default: ""
      build:
        description: BUILD number; defaults to the caller's run_number
        type: string
        required: false
        default: ""

concurrency:
  group: images-${{ inputs.ref || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  image:
    name: ${{ matrix.image }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write # push to GHCR
      id-token: write # cosign keyless signing
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: dbr2-server
            component: cmd/server
            context: .
            dockerfile: deployments/docker/Dockerfile.services
            cmd: server
          - image: dbr2-worker
            component: cmd/worker
            context: .
            dockerfile: deployments/docker/Dockerfile.services
            cmd: worker
          - image: dbr2-reposerver
            component: cmd/reposerver
            context: .
            dockerfile: deployments/docker/Dockerfile.services
            cmd: reposerver
          - image: dbr2-web
            component: web
            context: web
            dockerfile: web/Dockerfile
            cmd: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - name: Compute version and tags
        id: meta
        env:
          IMAGE: ghcr.io/axiomoperator/${{ matrix.image }}
          COMPONENT: ${{ matrix.component }}
          BUILD: ${{ inputs.build || github.run_number }}
          EDGE: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          CMD: ${{ matrix.cmd }}
        run: |
          v=$(tr -d '[:space:]' < "$COMPONENT/VERSION")
          [[ $v =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::$COMPONENT/VERSION is '$v'"; exit 1; }
          full="$v.$BUILD"
          tags="$IMAGE:$full,$IMAGE:$v,$IMAGE:${v%.*}"
          [[ $EDGE == true ]] && tags="$tags,$IMAGE:edge"
          {
            echo "version=$full"
            echo "tags=$tags"
            echo "build-args<<EOF"
            echo "BUILD=$BUILD"
            [[ -n $CMD ]] && echo "CMD=$CMD"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "Tags: $tags"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          build-args: ${{ steps.meta.outputs.build-args }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.title=${{ matrix.image }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ inputs.ref || github.sha }}
            org.opencontainers.image.licenses=Apache-2.0
          platforms: linux/amd64
          push: true
          provenance: mode=max
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

      - name: SBOM (SPDX)
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: ghcr.io/axiomoperator/${{ matrix.image }}@${{ steps.build.outputs.digest }}
          registry-username: ${{ github.actor }}
          registry-password: ${{ github.token }}
          format: spdx-json
          output-file: ${{ matrix.image }}-${{ steps.meta.outputs.version }}.spdx.json
          artifact-name: sbom-${{ matrix.image }}.spdx.json
          upload-release-assets: false

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign image and attest SBOM (keyless)
        env:
          IMAGE: ${{ matrix.image }}
          VERSION: ${{ steps.meta.outputs.version }}
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.build.outputs.digest }}
          REF: ghcr.io/axiomoperator/${{ matrix.image }}@${{ steps.build.outputs.digest }}
          SBOM: ${{ matrix.image }}-${{ steps.meta.outputs.version }}.spdx.json
        run: |
          cosign sign --yes "$REF"
          cosign attest --yes --type spdxjson --predicate "$SBOM" "$REF"
          {
            echo "### $IMAGE $VERSION"
            echo "- digest: \`$DIGEST\`"
            echo "- tags: \`$TAGS\`"
            echo "- verify: \`cosign verify $REF --certificate-identity-regexp '^https://github.com/$GITHUB_REPOSITORY/' --certificate-oidc-issuer https://token.actions.githubusercontent.com\`"
          } >> "$GITHUB_STEP_SUMMARY"
