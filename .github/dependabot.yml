# SPDX-License-Identifier: Apache-2.0
#
# Weekly dependency updates; minor and patch updates are grouped per ecosystem.
# Remember: dependency bumps touch components, so the PR needs changelog
# entries (ADR-0015) and a refreshed THIRD_PARTY_NOTICES
# (scripts/ci/third-party-notices.sh).
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    groups:
      go-minor-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: "deps(go)"

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: "deps(web)"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions-minor-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: "ci"

  - package-ecosystem: docker
    directories:
      - /deployments/docker
      - /web
    schedule:
      interval: weekly
    groups:
      docker-minor-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: "deps(docker)"
