// Internal control plane protocol between dbr2-worker (Temporal activities)
// and the Agent Gateway in dbr2-server (ADR-0001). Not exposed outside the
// deployment network; authenticated with the internal token.
syntax = "proto3";

package control.v1;

import "agent/v1/agent.proto";

option go_package = "github.com/AxiomOperator/dbr2/internal/agentpb/control/v1;controlv1";

// GatewayControlService dispatches commands to connected agents.
service GatewayControlService {
  // Dispatch sends a command to an agent and streams its updates until the
  // terminal result. If the agent is offline, the gateway waits up to
  // wait_for_agent_seconds for it to reconnect. Re-dispatching the same
  // command_id is idempotent.
  rpc Dispatch(DispatchRequest) returns (stream DispatchResponse);
}

// DispatchRequest identifies the agent and the command.
message DispatchRequest {
  string agent_id = 1;
  agent.v1.Command command = 2;
  uint32 wait_for_agent_seconds = 3;
}

// DispatchResponse carries one command update.
message DispatchResponse {
  agent.v1.CommandUpdate update = 1;
}

// PlatformService lets dbr2-worker read and update platform state owned by
// dbr2-server (PostgreSQL, repository management, agent credentials).
service PlatformService {
  // PrepareBackup validates the application, host and Repository, records a
  // pending recovery point and returns the capture plan.
  rpc PrepareBackup(PrepareBackupRequest) returns (PrepareBackupResponse);
  // EnsureAgentAccess makes sure the agent has a Kopia user on the
  // Repository and has been configured with it. Passwords never leave
  // dbr2-server except to the reposerver and the agent.
  rpc EnsureAgentAccess(EnsureAgentAccessRequest) returns (EnsureAgentAccessResponse);
  // CompleteBackup records the outcome of a backup (committed or failed).
  rpc CompleteBackup(CompleteBackupRequest) returns (CompleteBackupResponse);
  // GetRepository returns a Repository's connection details.
  rpc GetRepository(GetRepositoryRequest) returns (GetRepositoryResponse);
  // ListRepositories returns every Repository that is not retired.
  rpc ListRepositories(ListRepositoriesRequest) returns (ListRepositoriesResponse);
  // IndexRecoveryPoints upserts recovery points found by reindexing.
  rpc IndexRecoveryPoints(IndexRecoveryPointsRequest) returns (IndexRecoveryPointsResponse);
  // RecordEvent records an audit event and alert on behalf of the worker.
  rpc RecordEvent(RecordEventRequest) returns (RecordEventResponse);
  // PrepareRestore marks a requested restore running and returns its plan.
  rpc PrepareRestore(PrepareRestoreRequest) returns (PrepareRestoreResponse);
  // GrantRestoreAccess grants the target agent temporary READ on the
  // source agent's snapshots (cross-host restore); RevokeRestoreAccess
  // removes it (saga compensation).
  rpc GrantRestoreAccess(GrantRestoreAccessRequest) returns (GrantRestoreAccessResponse);
  rpc RevokeRestoreAccess(RevokeRestoreAccessRequest) returns (RevokeRestoreAccessResponse);
  // UpdateRestore records progress (step) and the final outcome.
  rpc UpdateRestore(UpdateRestoreRequest) returns (UpdateRestoreResponse);
  // ListRetentionCandidates returns recovery points to delete now: those
  // outside their policy's retention and manual deletions whose grace
  // period has passed (ADR-0014). Never the latest committed recovery point
  // of an application, never one used by an active restore.
  rpc ListRetentionCandidates(ListRetentionCandidatesRequest) returns (ListRetentionCandidatesResponse);
  // BeginRecoveryPointDeletion marks a recovery point deleting (the worker
  // then deletes the manifest first, then the components, as maint@dbr2).
  rpc BeginRecoveryPointDeletion(BeginRecoveryPointDeletionRequest) returns (BeginRecoveryPointDeletionResponse);
  // FinishRecoveryPointDeletion records the outcome.
  rpc FinishRecoveryPointDeletion(FinishRecoveryPointDeletionRequest) returns (FinishRecoveryPointDeletionResponse);
  // ListVerificationCandidates returns committed recovery points of a
  // Repository to verify, least recently verified first.
  rpc ListVerificationCandidates(ListVerificationCandidatesRequest) returns (ListVerificationCandidatesResponse);
  // SetVerification records a recovery point's verification result.
  rpc SetVerification(SetVerificationRequest) returns (SetVerificationResponse);
  // BeginPlatformBackup records a running Platform Protection run (ADR-0008)
  // and returns its ID and the System Repository (if one is designated).
  rpc BeginPlatformBackup(BeginPlatformBackupRequest) returns (BeginPlatformBackupResponse);
  // ExportPlatform streams the age-encrypted Platform Recovery Bundle
  // (tar -> zstd -> age to every escrow recipient) in ~1 MiB chunks. The
  // bundle is encrypted inside dbr2-server; plaintext never leaves it. The
  // last message carries the summary (plaintext manifest, no secrets).
  rpc ExportPlatform(ExportPlatformRequest) returns (stream ExportPlatformResponse);
  // RecordPlatformBackup stores the outcome of a platform backup (audit
  // event, and an alert when it is partial or failed).
  rpc RecordPlatformBackup(RecordPlatformBackupRequest) returns (RecordPlatformBackupResponse);
}

message PrepareRestoreRequest {
  string restore_id = 1;
  string workflow_id = 2;
  string run_id = 3;
}

message PrepareRestoreResponse {
  string restore_id = 1;
  string recovery_point_id = 2;
  Repository repository = 3;
  string source_agent_id = 4;
  string target_agent_id = 5;
  bool cross_host = 6;
  repeated agent.v1.RestoreSpec components = 7;
  // The config component snapshot (container re-creation); empty when not
  // selected.
  string config_snapshot_id = 8;
  repeated agent.v1.PathRemap path_remaps = 9;
  repeated agent.v1.ImageSpec images = 10;
  repeated agent.v1.NetworkSpec networks = 11;
  // Containers of the target application on the target host to stop
  // before the data is swapped (in-place restore).
  repeated string stop_container_ids = 12;
  bool recreate_containers = 13;
  repeated agent.v1.RestoreDatabaseCommand databases = 14;
  uint32 health_timeout_seconds = 15;
  // Dead-man lease for the stop (seconds).
  uint32 lease_seconds = 16;
  string target_application_id = 17;
  // Container names that were running when the recovery point was captured
  // (from the manifest topology, recorded before any quiesce): re-created
  // containers in this set are started.
  repeated string running_at_capture = 18;
}

message GrantRestoreAccessRequest {
  string restore_id = 1;
}

message GrantRestoreAccessResponse {
  string grant_id = 1;
}

message RevokeRestoreAccessRequest {
  string restore_id = 1;
  string grant_id = 2;
}

message RevokeRestoreAccessResponse {}

message UpdateRestoreRequest {
  string restore_id = 1;
  // running | succeeded | failed | rolled_back
  string state = 2;
  // Current step (progress), e.g. "restore-data".
  string step = 3;
  // Result document (JSON): component, container and health outcomes.
  bytes result_json = 4;
  string error = 5;
}

message UpdateRestoreResponse {}

// Repository describes how to reach a Repository.
message Repository {
  string id = 1;
  string name = 2;
  // Kopia repository server URL (agents and worker).
  string server_url = 3;
  string cert_sha256 = 4;
  // Reposerver management API base URL (internal network).
  string management_url = 5;
  // ready | awaiting_escrow | …
  string status = 6;
  // Kopia repository server URL for dbr2-worker on the deployment network
  // (empty = server_url).
  string internal_server_url = 7;
}

message PrepareBackupRequest {
  string application_id = 1;
  string workflow_id = 2;
  string run_id = 3;
  // manual | scheduled
  string trigger = 4;
  string requested_by = 5;
  // Optional override: live | quiesced | offline.
  string consistency_mode = 6;
}

message PrepareBackupResponse {
  string recovery_point_id = 1;
  string agent_id = 2;
  Repository repository = 3;
  string application_name = 4;
  // live | quiesced | offline
  string consistency_mode = 5;
  uint32 max_quiesce_seconds = 6;
  repeated agent.v1.ComponentSpec components = 7;
  repeated string container_ids = 8;
  repeated agent.v1.Hook pre_hooks = 9;
  repeated agent.v1.Hook post_hooks = 10;
  // Components with no previous committed recovery point that need a seed
  // pass (ADR-0005).
  repeated string seed_components = 11;
  // Application identity and source snapshot for the manifest (JSON).
  bytes application_json = 12;
  string host_id = 13;
  string hostname = 14;
  // Seconds to wait for the backup window to open (0 = open now).
  uint32 wait_for_window_seconds = 15;
  // Recovery Contract to evaluate at capture time (JSON:
  // {"max_rpo_minutes":N,"required_components":[...]}); empty = none.
  bytes contract_json = 16;
}

message EnsureAgentAccessRequest {
  string agent_id = 1;
  string repository_id = 2;
  string command_id = 3;
}

message EnsureAgentAccessResponse {
  string username = 1;
  string hostname = 2;
}

message CompleteBackupRequest {
  string recovery_point_id = 1;
  // committed | failed
  string outcome = 2;
  // Manifest JSON (committed).
  bytes manifest_json = 3;
  string manifest_snapshot_id = 4;
  string error = 5;
}

message CompleteBackupResponse {}

message GetRepositoryRequest {
  string repository_id = 1;
}

message GetRepositoryResponse {
  Repository repository = 1;
}

message ListRepositoriesRequest {}

message ListRepositoriesResponse {
  repeated Repository repositories = 1;
}

message IndexRecoveryPointsRequest {
  string repository_id = 1;
  repeated IndexedRecoveryPoint recovery_points = 2;
  // Recovery point IDs present in the Repository; with complete=true, index
  // rows of this Repository not listed are marked missing (ADR-0003).
  bool complete = 3;
}

message IndexedRecoveryPoint {
  bytes manifest_json = 1;
  string manifest_snapshot_id = 2;
}

message IndexRecoveryPointsResponse {
  uint32 upserted = 1;
  uint32 marked_missing = 2;
}

message RecordEventRequest {
  string type = 1;
  string target_type = 2;
  string target_id = 3;
  // success | failure
  string outcome = 4;
  // JSON details.
  bytes details = 5;
  // critical | warning | info ("" = audit only)
  string alert_severity = 6;
}

message RecordEventResponse {}

message ListRetentionCandidatesRequest {}

message RetentionCandidate {
  string recovery_point_id = 1;
  string repository_id = 2;
  string application_id = 3;
  // retention | manual
  string reason = 4;
}

message ListRetentionCandidatesResponse {
  repeated RetentionCandidate candidates = 1;
}

message BeginRecoveryPointDeletionRequest {
  string recovery_point_id = 1;
}

message BeginRecoveryPointDeletionResponse {
  string repository_id = 1;
  string application_id = 2;
  // False when the recovery point is no longer eligible (e.g. undeleted).
  bool proceed = 3;
}

message FinishRecoveryPointDeletionRequest {
  string recovery_point_id = 1;
  string reason = 2;
  string error = 3;
  int32 snapshots_deleted = 4;
}

message FinishRecoveryPointDeletionResponse {}

message ListVerificationCandidatesRequest {
  string repository_id = 1;
  uint32 limit = 2;
  // Only this recovery point (on-demand verification of one).
  string recovery_point_id = 3;
}

message VerificationCandidate {
  string recovery_point_id = 1;
  bytes manifest_json = 2;
}

message ListVerificationCandidatesResponse {
  repeated VerificationCandidate candidates = 1;
}

message SetVerificationRequest {
  string recovery_point_id = 1;
  bool ok = 2;
  // JSON: per-component results (files, bytes read, errors).
  bytes details_json = 3;
}

message SetVerificationResponse {}

message BeginPlatformBackupRequest {
  string workflow_id = 1;
  string run_id = 2;
  // scheduled | manual
  string trigger = 3;
  string requested_by = 4;
}

message BeginPlatformBackupResponse {
  string backup_id = 1;
  // The System Repository; unset when none is designated.
  Repository system_repository = 2;
}

message ExportPlatformRequest {
  string backup_id = 1;
}

message ExportPlatformResponse {
  // Encrypted bundle bytes (append in order).
  bytes data = 1;
  // Set on the final message only.
  ExportPlatformSummary summary = 2;
}

message ExportPlatformSummary {
  // manifest.json of the bundle (plaintext; no secrets).
  bytes manifest_json = 1;
  // Repositories whose reposerver state could not be exported.
  repeated string missing_repository_ids = 2;
}

message RecordPlatformBackupRequest {
  string backup_id = 1;
  // succeeded | partial | failed (the server downgrades succeeded to partial
  // when reposerver state was missing from the bundle).
  string state = 2;
  int64 size_bytes = 3;
  // SHA-256 (hex) of the encrypted bundle.
  string sha256 = 4;
  string file_name = 5;
  // Kopia snapshot in the System Repository ("" = not written there).
  string snapshot_id = 6;
  string repository_id = 7;
  // Path of the copy in the bundle directory ("" = not written there).
  string bundle_path = 8;
  string error = 9;
}

message RecordPlatformBackupResponse {
  // Final state stored.
  string state = 1;
}
