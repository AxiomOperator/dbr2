#
# Development override: builds images from source and MOCKS the NFS
# Repository with a local directory (the dev box is not connected to the NAS;
# no throughput testing — final_stack → Testing → Storage mocking).
#   docker compose -f compose.yaml -f compose.dev.yaml up -d --build
# Console: https://localhost:9443 (Caddy internal CA; accept the certificate).
# Builds use the host network (`network: host`): on hosts whose resolver is
# systemd-resolved with an IPv6 upstream, the default build network cannot
# reach DNS (go mod download / npm ci fail with "network is unreachable").

services:
  proxy:
    ports: !override
      - "127.0.0.1:${DBR2_DEV_HTTPS_PORT:-9443}:443"

  dbr2-web:
    image: dbr2-web:dev
    build:
      context: ../../web
      args: { BUILD: "0" }
      network: host

  dbr2-server:
    image: dbr2-server:dev
    build:
      context: ../..
      dockerfile: deployments/docker/Dockerfile.services
      args: { CMD: server, BUILD: "0" }
      network: host
    environment:
      DBR2_PUBLIC_URL: https://localhost:${DBR2_DEV_HTTPS_PORT:-9443}
      DBR2_GATEWAY_PUBLIC_ADDRESS: localhost:${DBR2_DEV_GATEWAY_PORT:-18443}
      DBR2_LOG_LEVEL: debug
    ports: !override
      - "${DBR2_DEV_GATEWAY_PORT:-18443}:8443"

  dbr2-worker:
    image: dbr2-worker:dev
    build:
      context: ../..
      dockerfile: deployments/docker/Dockerfile.services
      args: { CMD: worker, BUILD: "0" }
      network: host

  dbr2-reposerver:
    image: dbr2-reposerver:dev
    build:
      context: ../..
      dockerfile: deployments/docker/Dockerfile.services
      args: { CMD: reposerver, BUILD: "0" }
      network: host
    user: "${DBR2_DEV_UID:-1000}:${DBR2_DEV_GID:-1000}"
    environment:
      DBR2_REPOSITORY_ID: dev
      # Mock: a bind-mounted local directory is a mount point of the host's
      # filesystem type, so accept any type but still require a mount point.
      DBR2_REPOSERVER_EXPECT_FSTYPE: any
      DBR2_REPOSERVER_INIT_IF_EMPTY: "true"
    ports: !override
      - "127.0.0.1:${DBR2_DEV_REPOSERVER_PORT:-51515}:51515"
    volumes: !override
      - type: bind
        source: ../../.dev/repo
        target: /mnt/dbr2-repo
        bind: { create_host_path: true, selinux: Z }
      # Runs as the host user, so state lives in a host directory owned by
      # it (pre-created by `make dev-up`; Docker would create it root-owned).
      - type: bind
        source: ../../.dev/reposerver-state
        target: /var/lib/dbr2/reposerver
        bind: { create_host_path: true, selinux: Z }

  temporal-ui:
    ports: !override
      - "127.0.0.1:${DBR2_TEMPORAL_UI_PORT:-18233}:8080"
