# SPDX-License-Identifier: Apache-2.0
#
# DBR² production-style Docker Compose deployment (v1.0: single site).
#   1. ./init-secrets.sh            (once; writes .env and secrets/)
#   2. edit .env                    (hostname, TLS, Entra ID, repository mount)
#   3. docker compose up -d
# See README.md. Development: add -f compose.dev.yaml (mocked NFS, builds from source).

name: dbr2

x-dbr2-image-tag: &tag ${DBR2_VERSION:-0.1.0}

x-temporal-db-env: &temporal-db-env
  DB: postgres12
  DB_PORT: "5432"
  POSTGRES_SEEDS: postgres
  POSTGRES_USER: temporal
  POSTGRES_PWD: ${TEMPORAL_DB_PASSWORD:?run ./init-secrets.sh}
  DBNAME: temporal
  VISIBILITY_DBNAME: temporal_visibility

networks:
  dbr2:
    ipam:
      config:
        - subnet: ${DBR2_SUBNET:-172.31.230.0/24}

volumes:
  pgdata: {}
  caddy-data: {}
  caddy-config: {}
  server-state: {}

secrets:
  postgres_password: { file: ./secrets/postgres_password }
  temporal_db_password: { file: ./secrets/temporal_db_password }
  dbr2_db_password: { file: ./secrets/dbr2_db_password }
  dbr2_database_url: { file: ./secrets/dbr2_database_url }
  dbr2_secret_key: { file: ./secrets/dbr2_secret_key }
  dbr2_entra_client_secret: { file: ./secrets/dbr2_entra_client_secret }

services:
  # Edge: TLS termination and routing. /api/* → dbr2-server, everything else →
  # dbr2-web, on one origin. Caddy discards client-supplied X-Forwarded-* from
  # untrusted peers, and dbr2-server trusts only this proxy's address, so
  # audit source IPs and login rate limits cannot be spoofed.
  proxy:
    image: docker.io/library/caddy:2.10.2-alpine
    restart: unless-stopped
    ports:
      - "${DBR2_HTTPS_PORT:-443}:443"
    environment:
      DBR2_HOSTNAME: ${DBR2_HOSTNAME:-localhost}
      DBR2_TLS: ${DBR2_TLS:-internal}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./certs:/certs:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      dbr2:
        ipv4_address: ${DBR2_PROXY_IP:-172.31.230.10}
    depends_on:
      dbr2-server: { condition: service_healthy }
      dbr2-web: { condition: service_started }

  dbr2-web:
    image: ${DBR2_REGISTRY:-ghcr.io/axiomoperator}/dbr2-web:${DBR2_WEB_VERSION:-0.1.0}
    restart: unless-stopped
    environment:
      DBR2_API_INTERNAL_URL: http://dbr2-server:8080
    networks: [dbr2]

  dbr2-server:
    image: ${DBR2_REGISTRY:-ghcr.io/axiomoperator}/dbr2-server:${DBR2_SERVER_VERSION:-0.1.0}
    restart: unless-stopped
    environment:
      DBR2_DATABASE_URL_FILE: /run/secrets/dbr2_database_url
      DBR2_SECRET_KEY_FILE: /run/secrets/dbr2_secret_key
      DBR2_PUBLIC_URL: https://${DBR2_HOSTNAME:-localhost}${DBR2_PUBLIC_PORT_SUFFIX:-}
      DBR2_TRUSTED_PROXY_CIDRS: ${DBR2_PROXY_IP:-172.31.230.10}/32
      DBR2_TEMPORAL_ADDRESS: temporal:7233
      DBR2_VALKEY_ADDR: valkey:6379
      DBR2_API_DOCS_PUBLIC: ${DBR2_API_DOCS_PUBLIC:-false}
      DBR2_MASTER_ADMIN_USERNAME: ${DBR2_MASTER_ADMIN_USERNAME:-dbr2-admin}
      DBR2_ENTRA_TENANT_ID: ${DBR2_ENTRA_TENANT_ID:-}
      DBR2_ENTRA_CLIENT_ID: ${DBR2_ENTRA_CLIENT_ID:-}
      DBR2_ENTRA_CLIENT_SECRET_FILE: ${DBR2_ENTRA_CLIENT_SECRET_FILE:-}
      DBR2_OTEL_ENABLED: ${DBR2_OTEL_ENABLED:-false}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    secrets: [dbr2_database_url, dbr2_secret_key, dbr2_entra_client_secret]
    volumes:
      - server-state:/var/lib/dbr2
    networks: [dbr2]
    depends_on:
      postgres: { condition: service_healthy }
      valkey: { condition: service_started }

  dbr2-worker:
    image: ${DBR2_REGISTRY:-ghcr.io/axiomoperator}/dbr2-worker:${DBR2_WORKER_VERSION:-0.1.0}
    restart: unless-stopped
    environment:
      DBR2_TEMPORAL_ADDRESS: temporal:7233
      DBR2_OTEL_ENABLED: ${DBR2_OTEL_ENABLED:-false}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    networks: [dbr2]
    depends_on:
      temporal-namespace: { condition: service_completed_successfully }

  # One reposerver per Repository (ADR-0002). v1.0: the NAS is mounted on the
  # Docker host at DBR2_REPO_HOST_PATH (nfs4, hard) and bind-mounted here; the
  # storage guard refuses to run unless it is an active nfs4 mount with the
  # matching sentinel. Initialize once: docker compose run --rm dbr2-reposerver init
  dbr2-reposerver:
    image: ${DBR2_REGISTRY:-ghcr.io/axiomoperator}/dbr2-reposerver:${DBR2_REPOSERVER_VERSION:-0.1.0}
    restart: unless-stopped
    environment:
      DBR2_REPOSITORY_ID: ${DBR2_REPOSITORY_ID:-primary}
      DBR2_REPOSERVER_PATH: /mnt/dbr2-repo
      DBR2_REPOSERVER_EXPECT_FSTYPE: nfs4
    volumes:
      - type: bind
        source: ${DBR2_REPO_HOST_PATH:-/mnt/dbr2-repo}
        target: /mnt/dbr2-repo
        bind: { propagation: rslave }
    networks: [dbr2]

  postgres:
    image: docker.io/library/postgres:18.6-trixie
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets: [postgres_password, temporal_db_password, dbr2_db_password]
    volumes:
      - pgdata:/var/lib/postgresql   # PG18 layout (PGDATA=/var/lib/postgresql/18/docker)
      - ./postgres:/docker-entrypoint-initdb.d:ro
    networks: [dbr2]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres && psql -U postgres -tAc \"select 1 from pg_database where datname='dbr2'\" | grep -q 1"]
      interval: 5s
      timeout: 5s
      retries: 60

  valkey:
    image: docker.io/valkey/valkey:8.1.4-alpine
    restart: unless-stopped
    # Disposable cache only (ADR-0010): no persistence, never locks.
    command: ["valkey-server", "--save", "", "--appendonly", "no", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    networks: [dbr2]

  temporal-schema:
    image: docker.io/temporalio/admin-tools:1.32.0
    environment:
      <<: *temporal-db-env
      SQL_PASSWORD: ${TEMPORAL_DB_PASSWORD}
    volumes:
      - ./temporal:/scripts:ro
    entrypoint: ["/bin/sh", "/scripts/setup-schema.sh"]
    networks: [dbr2]
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  temporal:
    image: docker.io/temporalio/server:1.32.0
    restart: unless-stopped
    environment:
      <<: *temporal-db-env
      BIND_ON_IP: 0.0.0.0
      DYNAMIC_CONFIG_FILE_PATH: config/dynamicconfig/production.yaml
    volumes:
      - ./temporal/dynamicconfig:/etc/temporal/config/dynamicconfig:ro
    networks: [dbr2]
    depends_on:
      temporal-schema: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "7233"]
      interval: 5s
      timeout: 3s
      start_period: 30s
      retries: 60

  temporal-namespace:
    image: docker.io/temporalio/admin-tools:1.32.0
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      NAMESPACE: dbr2
    volumes:
      - ./temporal:/scripts:ro
    entrypoint: ["/bin/sh", "/scripts/create-namespace.sh"]
    networks: [dbr2]
    depends_on:
      temporal: { condition: service_healthy }
    restart: "no"

  # Administrators only: exposes workflow inputs. Bound to loopback; reach it
  # through an SSH tunnel.
  temporal-ui:
    image: docker.io/temporalio/ui:2.54.1
    restart: unless-stopped
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_DEFAULT_NAMESPACE: dbr2
    ports:
      - "127.0.0.1:${DBR2_TEMPORAL_UI_PORT:-8233}:8080"
    networks: [dbr2]
    depends_on:
      temporal: { condition: service_healthy }
