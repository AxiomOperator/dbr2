      tags:
        - Restores
      x-dbr2-permission: restore.read
  /api/v1/restores/{id}/cancel:
    post:
      description: |-
        Requests cancellation of a running restore. Compensation runs: the previous data and containers are put back and the restore ends as rolled_back (or failed if nothing had changed yet).

        Requires permission `restore.execute`.
      operationId: cancel-restore
      parameters:
        - in: path
          name: id
          required: true
          schema:
            pattern: ^rs_[0-9A-HJKMNP-TV-Z]{26}$
            type: string
      responses:
        "202":
          description: Accepted
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Unauthorized
        "403":
