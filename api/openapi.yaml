  /api/v1/repositories/{id}/verify:
    post:
      description: |-
        Starts repository/{id}/verify: the least recently verified recovery points are checked (every object present, `read_percent` of files fully read and hash-verified). Results set each recovery point to verified or verification_failed (critical alert). A weekly schedule verifies every Repository.

        Requires permission `repository.manage`.
