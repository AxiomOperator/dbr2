          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Internal Server Error
      summary: Verify a Repository
      tags:
        - Repositories
      x-dbr2-permission: repository.manage
  /api/v1/restores:
    get:
      description: |-
        Recovery history: every restore attempt, including failures and rollbacks, newest first.

        Requires permission `restore.read`.
      operationId: list-restores
      parameters:
        - explode: false
          in: query
          name: application_id
          schema:
            format: uuid
            type: string
        - explode: false
          in: query
          name: state
          schema:
            enum:
              - requested
              - running
              - succeeded
              - failed
              - rolled_back
            type: string
        - explode: false
          in: query
          name: limit
          schema:
            default: 100
            format: int32
            maximum: 500
            minimum: 1
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/List-restoresResponse"
          description: OK
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Unauthorized
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Forbidden
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Internal Server Error
      summary: List restores
      tags:
        - Restores
      x-dbr2-permission: restore.read
  /api/v1/restores/{id}:
