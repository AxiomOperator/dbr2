components:
  schemas:
    APIToken:
      additionalProperties: false
      properties:
        created_at:
          format: date-time
          type: string
        expires_at:
          format: date-time
          type:
            - string
            - "null"
        id:
          format: uuid
          type: string
        last_used_at:
          format: date-time
          type:
            - string
            - "null"
        name:
          type: string
        prefix:
          description: First characters of the token, for identification.
          type: string
        revoked_at:
          format: date-time
          type:
            - string
            - "null"
      required:
        - id
        - name
        - prefix
        - created_at
        - expires_at
        - last_used_at
        - revoked_at
      type: object
    Add-escrow-recipientRequest:
      additionalProperties: false
      properties:
        name:
          maxLength: 100
          minLength: 1
          type: string
        public_key:
          maxLength: 2000
          minLength: 1
          type: string
      required:
        - name
        - public_key
      type: object
    AgentDTO:
      additionalProperties: false
      properties:
        agent_version:
          type: string
        approved_at:
          format: date-time
          type:
            - string
            - "null"
        architecture:
          type:
            - string
            - "null"
        certificate_not_after:
          format: date-time
          type:
            - string
            - "null"
        connected:
          description: The agent has a live gateway session.
          type: boolean
        docker_reachable:
          type:
            - boolean
            - "null"
        docker_version:
          type:
            - string
            - "null"
        enrolled_at:
          format: date-time
          type: string
        health_error:
          type:
            - string
            - "null"
        hostname:
          type: string
        id:
          format: uuid
          type: string
        last_seen_at:
          format: date-time
          type:
            - string
            - "null"
        latency_ms:
          format: int32
          type:
            - integer
            - "null"
        os_release:
          type:
            - string
            - "null"
        outdated:
          description: Older than the agent version this server ships.
          type: boolean
        protocol_version:
          type: string
        status:
          enum:
            - pending
            - active
            - suspended
            - revoked
          type: string
        status_reason:
          type:
            - string
            - "null"
      required:
        - id
        - hostname
        - status
        - status_reason
        - connected
        - outdated
        - agent_version
        - protocol_version
        - os_release
        - architecture
        - enrolled_at
        - approved_at
        - last_seen_at
        - latency_ms
        - docker_reachable
        - docker_version
        - health_error
        - certificate_not_after
      type: object
    AgentStatusEvent:
      additionalProperties: false
      properties:
        connected:
          type: boolean
        host_id:
          type: string
      required:
        - host_id
        - connected
      type: object
    AlertCreatedEvent:
      additionalProperties: false
      properties:
        message:
          type: string
        severity:
          enum:
            - critical
            - warning
            - info
          type: string
        target_id:
          type: string
        target_type:
          type: string
        type:
          type: string
      required:
        - severity
        - type
        - message
      type: object
    AlertDTO:
      additionalProperties: false
      properties:
        acknowledged_at:
          format: date-time
          type:
            - string
            - "null"
        created_at:
          format: date-time
          type: string
        details: {}
        id:
          format: int64
          type: integer
        message:
          type: string
        severity:
          enum:
            - critical
            - warning
            - info
          type: string
        target_id:
          type:
            - string
            - "null"
        target_type:
          type:
            - string
            - "null"
        type:
          type: string
      required:
        - id
        - severity
        - type
        - target_type
        - target_id
        - message
        - details
        - created_at
        - acknowledged_at
      type: object
    Application:
      additionalProperties: false
      properties:
        bind_mounts:
          items:
            $ref: "#/components/schemas/BindUse"
          type:
            - array
            - "null"
        compose_project:
          type: string
        containers:
          items:
            type: string
          type:
            - array
            - "null"
        dependencies:
          items:
            $ref: "#/components/schemas/Dependency"
          type:
            - array
            - "null"
        images:
          items:
            $ref: "#/components/schemas/ImageRef"
          type:
            - array
            - "null"
        key:
          type: string
        kind:
          type: string
        name:
          type: string
        networks:
          items:
            $ref: "#/components/schemas/NetworkUse"
          type:
            - array
            - "null"
        secrets_count:
          format: int64
          type: integer
        services:
          items:
            $ref: "#/components/schemas/Service"
          type:
            - array
            - "null"
        source:
          type: string
        source_reason:
          type: string
        tmpfs:
          items:
            $ref: "#/components/schemas/TmpfsUse"
          type:
            - array
            - "null"
        unprotected:
          items:
            $ref: "#/components/schemas/Unprotected"
          type:
            - array
            - "null"
        volumes:
          items:
            $ref: "#/components/schemas/VolumeUse"
          type:
            - array
            - "null"
        working_dir:
          type: string
      required:
        - key
        - kind
        - name
        - source
        - services
        - volumes
        - bind_mounts
        - tmpfs
        - networks
        - images
        - dependencies
        - unprotected
        - secrets_count
        - containers
      type: object
    ApplicationDetail:
      additionalProperties: false
      properties:
        analysis:
          $ref: "#/components/schemas/Application"
          description: Services, volumes (with classification), bind mounts, networks, images (digest and platform), dependencies and unprotected paths. Null when the application is missing from the latest inventory.
        bind_mounts:
          format: int64
          type: integer
        collected_at:
          format: date-time
          type:
            - string
            - "null"
        containers:
          format: int64
          type: integer
        containers_detail:
          items:
            $ref: "#/components/schemas/ContainerDTO"
          type:
            - array
            - "null"
        criticality:
          type:
            - string
            - "null"
        dependencies:
          format: int64
          type: integer
        display_name:
          type:
            - string
            - "null"
        environment:
          type:
            - string
            - "null"
        host_id:
          format: uuid
          type: string
        hostname:
          type: string
        id:
          format: uuid
          type: string
        kind:
          enum:
            - compose
            - container
            - manual
          type: string
        last_seen_at:
          format: date-time
          type: string
        manual_containers:
          items:
            type: string
          type:
            - array
            - "null"
        missing_since:
          description: Set when the application disappeared from the host's latest inventory.
          format: date-time
          type:
            - string
            - "null"
        name:
          type: string
        owner:
          type:
            - string
            - "null"
        policy_id:
          description: Assigned Protection Policy (null = none).
          type:
            - string
            - "null"
        protection:
          $ref: "#/components/schemas/Protection"
          description: "Protection status (protected, at_risk, failed, unprotected) with reasons, the latest recovery point and attempt, a running operation, and coverage: each component the application has now and whether the latest recovery point contains it."
        secrets_count:
          format: int64
          type: integer
        services:
          format: int64
          type: integer
        source:
          description: Provenance of the Compose definition.
          enum:
            - original
            - reconstructed
            - unknown
          type: string
        unprotected_high:
          description: Writable paths not backed by a volume or bind mount (high severity).
          format: int64
          type: integer
        volumes:
          format: int64
          type: integer
      required:
        - analysis
        - containers_detail
        - collected_at
        - id
        - name
        - display_name
        - kind
        - host_id
        - hostname
        - source
        - services
        - containers
        - volumes
        - bind_mounts
        - unprotected_high
        - dependencies
        - secrets_count
        - owner
        - environment
        - criticality
        - last_seen_at
        - missing_since
        - policy_id
      type: object
    ApplicationSummary:
      additionalProperties: false
      properties:
        bind_mounts:
          format: int64
          type: integer
        containers:
          format: int64
          type: integer
        criticality:
          type:
            - string
            - "null"
        dependencies:
          format: int64
          type: integer
        display_name:
          type:
            - string
            - "null"
        environment:
          type:
            - string
            - "null"
        host_id:
          format: uuid
          type: string
        hostname:
          type: string
        id:
          format: uuid
          type: string
        kind:
          enum:
            - compose
            - container
            - manual
          type: string
        last_seen_at:
          format: date-time
          type: string
        missing_since:
          description: Set when the application disappeared from the host's latest inventory.
          format: date-time
          type:
            - string
            - "null"
        name:
          type: string
        owner:
          type:
            - string
            - "null"
        policy_id:
          description: Assigned Protection Policy (null = none).
          type:
            - string
            - "null"
        protection:
          $ref: "#/components/schemas/Protection"
          description: "Protection status (protected, at_risk, failed, unprotected) with reasons, the latest recovery point and attempt, a running operation, and coverage: each component the application has now and whether the latest recovery point contains it."
        secrets_count:
          format: int64
          type: integer
        services:
          format: int64
          type: integer
        source:
          description: Provenance of the Compose definition.
          enum:
            - original
            - reconstructed
            - unknown
          type: string
        unprotected_high:
          description: Writable paths not backed by a volume or bind mount (high severity).
          format: int64
          type: integer
        volumes:
          format: int64
          type: integer
      required:
        - id
        - name
        - display_name
        - kind
        - host_id
        - hostname
        - source
        - services
        - containers
        - volumes
        - bind_mounts
        - unprotected_high
        - dependencies
        - secrets_count
        - owner
        - environment
        - criticality
        - last_seen_at
        - missing_since
        - policy_id
      type: object
    Assign-policyRequest:
      additionalProperties: false
      properties:
        policy_id:
          format: uuid
          type:
            - string
            - "null"
      required:
        - policy_id
      type: object
    AuditEvent:
      additionalProperties: false
      properties:
        actor_display:
          type: string
        actor_kind:
          enum:
            - user
            - system
            - anonymous
          type: string
        after: {}
        before: {}
        details: {}
        event_id:
          format: uuid
          type: string
        event_type:
          description: Stable event identifier.
          examples:
            - auth.login.succeeded
          type: string
        occurred_at:
          format: date-time
          type: string
        reason:
          type:
            - string
            - "null"
        request_id:
          type:
            - string
            - "null"
        result:
          enum:
            - success
            - failure
            - denied
          type: string
        source_ip:
          type:
            - string
            - "null"
        target_id:
          type:
            - string
            - "null"
        target_type:
          type:
            - string
            - "null"
        trace_id:
          type:
            - string
            - "null"
      required:
        - event_id
        - occurred_at
        - event_type
        - actor_display
        - actor_kind
        - source_ip
        - target_type
        - target_id
        - result
        - reason
        - details
        - request_id
        - trace_id
      type: object
    AuditListOutputBody:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: "#/components/schemas/AuditEvent"
          type:
            - array
            - "null"
        next_cursor:
          type:
            - string
            - "null"
      required:
        - items
        - next_cursor
      type: object
    BackupSettingsDTO:
      additionalProperties: false
      properties:
        consistency_mode:
          description: "Null = automatic: quiesced when hooks are defined, otherwise live (crash-consistent)."
          enum:
            - live
            - quiesced
            - offline
          type:
            - string
            - "null"
        database_strategy:
          description: "Detected PostgreSQL/Redis containers: logical (dumps only; their data volumes are skipped), volume (no dumps) or both (default)."
          enum:
            - logical
            - volume
            - both
          type: string
        effective_mode:
          readOnly: true
          type: string
        excluded_components:
          items:
            type: string
          type:
            - array
            - "null"
        max_quiesce_seconds:
          description: Upper bound on quiesce; the agent dead-man switch resumes the application 10 minutes later.
          format: int32
          maximum: 86400
          minimum: 60
          type: integer
        optional_components:
          description: Best-effort components (e.g. volume:cache); their failure makes the recovery point Partial.
          items:
            type: string
          type:
            - array
            - "null"
        post_hooks:
          items:
            $ref: "#/components/schemas/HookDTO"
          type:
            - array
            - "null"
        pre_hooks:
          items:
            $ref: "#/components/schemas/HookDTO"
          type:
            - array
            - "null"
        repository_id:
          description: Null = the default Repository.
          format: uuid
          type:
            - string
            - "null"
        updated_at:
          format: date-time
          readOnly: true
          type: string
      required:
        - repository_id
        - consistency_mode
        - max_quiesce_seconds
        - pre_hooks
        - post_hooks
        - optional_components
        - excluded_components
      type: object
    BackupUpdatedEvent:
      additionalProperties: false
      properties:
        application_id:
          type: string
        error:
          type: string
        recovery_point_id:
          type: string
        state:
          enum:
            - pending
            - committed
            - failed
          type: string
        workflow_id:
          type: string
      required:
        - recovery_point_id
        - application_id
        - state
      type: object
    BindUse:
      additionalProperties: false
      properties:
        container:
          type: string
        destination:
          type: string
        rw:
          type: boolean
        source:
          type: string
      required:
        - container
        - source
        - destination
        - rw
      type: object
    Change:
      additionalProperties: false
      properties:
        kind:
          type: string
        path:
          type: string
      required:
        - path
        - kind
      type: object
    ChannelConfigDTO:
      additionalProperties: false
      properties:
        to:
          description: "Email channels: recipient addresses."
          items:
            type: string
          maxItems: 50
          type:
            - array
            - "null"
        url:
          description: "Webhook channels: the endpoint. https is required; plain http is accepted only for localhost / loopback addresses. Redirects are not followed."
          maxLength: 2000
          type: string
      type: object
    CodeInputBody:
      additionalProperties: false
      properties:
        code:
          pattern: ^[0-9]{6}$
          type: string
      required:
        - code
      type: object
    Collision:
      additionalProperties: false
      properties:
        detail:
          type: string
        kind:
          enum:
            - container_name
            - port
            - network
            - volume
            - bind_path
            - dependency
          type: string
        name:
          type: string
      required:
        - kind
        - name
        - detail
      type: object
    Complete-escrow-drillRequest:
      additionalProperties: false
      properties:
        confirmation_code:
          maxLength: 40
          minLength: 16
          type: string
      required:
        - confirmation_code
      type: object
    ComponentCoverage:
      additionalProperties: false
      properties:
        kind:
          enum:
            - config
            - volume
            - bind_mount
            - database
          type: string
        last_size_bytes:
          format: int64
          type: integer
        name:
          type: string
        protected:
          type: boolean
        required:
          type: boolean
      required:
        - name
        - kind
        - required
        - protected
        - last_size_bytes
      type: object
    ComposeDTO:
      additionalProperties: false
      properties:
        config_files:
          items:
            $ref: "#/components/schemas/FileDTO"
          type:
            - array
            - "null"
        env_files:
          items:
            $ref: "#/components/schemas/FileDTO"
          type:
            - array
            - "null"
        reason:
          type: string
        reconstructed:
          description: Generated Compose YAML (flagged RECONSTRUCTED; secrets as ${VAR} placeholders).
          type: string
        revealed:
          type: boolean
        secrets:
          additionalProperties:
            type: string
          description: Placeholder values; present only when revealed.
          type: object
        source:
          enum:
            - original
            - reconstructed
          type: string
      required:
        - source
        - config_files
        - env_files
        - revealed
      type: object
    ComposeProject:
      additionalProperties: false
      properties:
        config_files:
          items:
            $ref: "#/components/schemas/File"
          type:
            - array
            - "null"
        env_files:
          items:
            $ref: "#/components/schemas/File"
          type:
            - array
            - "null"
        errors:
          items:
            type: string
          type:
            - array
            - "null"
        name:
          type: string
        working_dir:
          type: string
      required:
        - name
        - working_dir
      type: object
    Confirm-repository-escrowRequest:
      additionalProperties: false
      properties:
        confirmation_code:
          maxLength: 40
          minLength: 16
          type: string
      required:
        - confirmation_code
      type: object
    Container:
      additionalProperties: false
      properties:
        changes:
          items:
            $ref: "#/components/schemas/Change"
          type:
            - array
            - "null"
        changes_error:
          type: string
        changes_truncated:
          type: boolean
        cmd:
          items:
            type: string
          type:
            - array
            - "null"
        created:
          format: date-time
          type: string
        entrypoint:
          items:
            type: string
          type:
            - array
            - "null"
        env:
          items:
            $ref: "#/components/schemas/EnvVar"
          type:
            - array
            - "null"
        id:
          type: string
        image:
          type: string
        image_id:
          type: string
        labels:
          additionalProperties:
            type: string
          type: object
        mounts:
          items:
            $ref: "#/components/schemas/Mount"
          type:
            - array
            - "null"
        name:
          type: string
        network_mode:
          type: string
        networks:
          items:
            type: string
          type:
            - array
            - "null"
        ports:
          items:
            $ref: "#/components/schemas/Port"
          type:
            - array
            - "null"
        read_only_rootfs:
          type: boolean
        restart_policy:
          type: string
        state:
          type: string
        tmpfs:
          additionalProperties:
            type: string
          type: object
        user:
          type: string
        working_dir:
          type: string
      required:
        - id
        - name
        - image
        - image_id
        - state
        - created
      type: object
    ContainerDTO:
      additionalProperties: false
      properties:
        env:
          items:
            $ref: "#/components/schemas/EnvVar"
          type:
            - array
            - "null"
        id:
          type: string
        image:
          type: string
        mounts:
          items:
            $ref: "#/components/schemas/Mount"
          type:
            - array
            - "null"
        name:
          type: string
        networks:
          items:
            type: string
          type:
            - array
            - "null"
        ports:
          items:
            $ref: "#/components/schemas/Port"
          type:
            - array
            - "null"
        state:
          type: string
      required:
        - id
        - name
        - image
        - state
        - env
        - ports
        - mounts
        - networks
      type: object
    ContainerRef:
      additionalProperties: false
      properties:
        id:
          type: string
        name:
          type: string
        state:
          type: string
      required:
        - id
        - name
        - state
      type: object
    ContractDTO:
      additionalProperties: false
      properties:
        application_id:
          format: uuid
          type: string
        application_name:
          type: string
        evaluated_at:
          format: date-time
          type:
            - string
            - "null"
        max_rpo_minutes:
          description: Maximum age of the latest recovery point (null = no RPO).
          format: int32
          type:
            - integer
            - "null"
        required_components:
          items:
            type: string
          type:
            - array
            - "null"
        state:
          enum:
            - satisfied
            - violated
            - unknown
          type: string
        state_reasons:
          items:
            type: string
          type:
            - array
            - "null"
        violated_since:
          format: date-time
          type:
            - string
            - "null"
      required:
        - application_id
        - max_rpo_minutes
        - required_components
        - state
        - state_reasons
        - evaluated_at
        - violated_since
      type: object
    Cookie:
      additionalProperties: false
      properties:
        Domain:
          type: string
        Expires:
          format: date-time
          type: string
        HttpOnly:
          type: boolean
        MaxAge:
          format: int64
          type: integer
        Name:
          type: string
        Partitioned:
          type: boolean
        Path:
          type: string
        Quoted:
          type: boolean
        Raw:
          type: string
        RawExpires:
          type: string
        SameSite:
          format: int64
          type: integer
        Secure:
          type: boolean
        Unparsed:
          items:
            type: string
          type:
            - array
            - "null"
        Value:
          type: string
      required:
        - Name
        - Value
        - Quoted
        - Path
        - Domain
        - Expires
        - RawExpires
        - MaxAge
        - Secure
        - HttpOnly
        - SameSite
        - Partitioned
        - Raw
        - Unparsed
      type: object
    Create-applicationRequest:
      additionalProperties: false
      properties:
        containers:
          items:
            type: string
          minItems: 1
          type:
            - array
            - "null"
        host_id:
          format: uuid
          type: string
        name:
          maxLength: 200
          minLength: 1
          type: string
      required:
        - name
        - host_id
        - containers
      type: object
    Create-applicationResponse:
      additionalProperties: false
      properties:
        id:
          type: string
      required:
        - id
      type: object
    Create-notification-channelRequest:
      additionalProperties: false
      properties:
        config:
          $ref: "#/components/schemas/ChannelConfigDTO"
        enabled:
          default: true
          type: boolean
        events:
          description: Event types to deliver (exact or prefix wildcard such as backup.*); empty or omitted = all.
          items:
            type: string
          maxItems: 100
          type:
            - array
            - "null"
        kind:
          enum:
            - email
            - webhook
          type: string
        min_severity:
          default: warning
          enum:
            - info
            - warning
            - critical
          type: string
        name:
          maxLength: 100
          minLength: 1
          type: string
        secret:
          description: "Webhook signing secret (min. 16 characters). Requests then carry X-DBR2-Signature: sha256=<hex HMAC-SHA256(secret, X-DBR2-Timestamp + \".\" + body)>. On update: omit to keep, empty string to remove."
          maxLength: 500
          type: string
