  - description: Sign-in (master admin and Entra ID), sessions, TOTP and API tokens.
    name: Authentication
  - description: Users, roles and Entra ID group mappings.
    name: Users
  - description: Append-only audit log.
    name: Audit
  - description: Agents, enrollment (registration tokens), approval, suspension, revocation and discovery.
