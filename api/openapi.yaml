      description: |-
        Includes the impact preview recorded at request time and the result document.

        Requires permission `restore.read`.
      operationId: get-restore
      parameters:
        - in: path
          name: id
          required: true
          schema:
            pattern: ^rs_[0-9A-HJKMNP-TV-Z]{26}$
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RestoreRunDTO"
