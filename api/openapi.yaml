  /api/v1/events:
    get:
      description: "A `text/event-stream` of live updates: agent command progress (`job.progress`: bytes hashed/uploaded, files, current component), recovery point and restore state changes, agent connections, new alerts and stored inventories. Each event is delivered only to callers holding the permission it needs (for example `backup.read` for backup progress). Events are hints to refresh: missed events are never replayed, so clients re-read state after reconnecting. `types` limits the stream to a comma-separated list of event types. A comment heartbeat is sent every 15 s."
      operationId: stream-events
      parameters:
        - description: "Comma-separated event types (default: all)."
          explode: false
          in: query
          name: types
          schema:
            description: "Comma-separated event types (default: all)."
            type: string
      responses:
        "200":
          content:
            text/event-stream:
              schema:
                description: Each oneOf object in the array represents one possible Server Sent Events (SSE) message, serialized as UTF-8 text according to the SSE specification.
                items:
                  oneOf:
                    - properties:
                        data:
                          $ref: "#/components/schemas/AgentStatusEvent"
                        event:
                          const: agent.status
                          description: The event name.
                          type: string
                        id:
                          description: The event ID.
                          type: integer
                        retry:
                          description: The retry time in milliseconds.
                          type: integer
                      required:
                        - data
                        - event
                      title: Event agent.status
                      type: object
                    - properties:
                        data:
                          $ref: "#/components/schemas/AlertCreatedEvent"
                        event:
                          const: alert.created
                          description: The event name.
                          type: string
                        id:
                          description: The event ID.
                          type: integer
                        retry:
                          description: The retry time in milliseconds.
                          type: integer
                      required:
                        - data
                        - event
                      title: Event alert.created
                      type: object
                    - properties:
                        data:
                          $ref: "#/components/schemas/BackupUpdatedEvent"
                        event:
                          const: backup.updated
                          description: The event name.
                          type: string
                        id:
                          description: The event ID.
                          type: integer
                        retry:
                          description: The retry time in milliseconds.
                          type: integer
                      required:
                        - data
                        - event
                      title: Event backup.updated
                      type: object
                    - properties:
                        data:
                          $ref: "#/components/schemas/InventoryUpdatedEvent"
                        event:
                          const: inventory.updated
                          description: The event name.
                          type: string
                        id:
                          description: The event ID.
                          type: integer
                        retry:
                          description: The retry time in milliseconds.
                          type: integer
                      required:
                        - data
                        - event
                      title: Event inventory.updated
                      type: object
                    - properties:
                        data:
                          $ref: "#/components/schemas/JobProgressEvent"
                        event:
                          const: job.progress
                          description: The event name.
                          type: string
                        id:
                          description: The event ID.
                          type: integer
