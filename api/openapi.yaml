          minimum: 0
          type: integer
      type: object
    Role:
      additionalProperties: false
      properties:
        description:
          type: string
        display_name:
          type: string
        permissions:
          items:
            type: string
          type:
            - array
            - "null"
        role:
          type: string
      required:
        - role
        - display_name
        - description
        - permissions
      type: object
    RoleAssignment:
      additionalProperties: false
      properties:
        role:
          examples:
            - backup_administrator
          type: string
        source:
          description: manual grants, Entra ID group mapping, or the implicit master admin role.
          enum:
            - manual
            - oidc_group
            - master_admin
          type: string
      required:
        - role
        - source
      type: object
    RolesOutputBody:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: "#/components/schemas/Role"
          type:
            - array
            - "null"
      required:
        - items
      type: object
    SMTPSettingsDTO:
      additionalProperties: false
      properties:
        configured:
          type: boolean
        from:
          type: string
        host:
          type: string
        password_set:
          description: Whether a password is stored (the password itself is write-only).
          type: boolean
        port:
          format: int64
          type: integer
        tls:
          enum:
            - starttls
            - tls
            - none
          type: string
        updated_at:
          format: date-time
          type:
            - string
            - "null"
        username:
          type: string
      required:
        - configured
        - host
        - port
        - username
        - from
        - tls
        - password_set
        - updated_at
      type: object
    Service:
      additionalProperties: false
      properties:
        containers:
          items:
            $ref: "#/components/schemas/ContainerRef"
          type:
            - array
            - "null"
        image:
          type: string
        name:
          type: string
      required:
        - name
        - image
        - containers
      type: object
    SetRolesInputBody:
      additionalProperties: false
      properties:
        reason:
          description: Why the change is made (stored in the audit log).
          maxLength: 500
          minLength: 1
          type: string
        roles:
          description: Complete list of manually granted roles (group-mapped roles are managed by Entra ID).
          items:
            type: string
          type:
            - array
            - "null"
      required:
        - roles
        - reason
      type: object
    SetStatusInputBody:
      additionalProperties: false
      properties:
        disabled:
          type: boolean
        reason:
          maxLength: 500
          minLength: 1
          type: string
      required:
        - disabled
        - reason
      type: object
    Start-backupRequest:
      additionalProperties: false
      properties:
        consistency_mode:
          description: Override for this run.
          enum:
            - live
            - quiesced
            - offline
          type: string
      type: object
    StartRestoreBody:
      additionalProperties: false
      properties:
        components:
          description: "Component names from the manifest (default: every captured component). fsmeta records follow their volume or bind mount automatically."
          items:
            type: string
          type:
            - array
            - "null"
        confirmation:
          description: "Production restores: type the application name exactly."
          maxLength: 200
          type: string
        path_remaps:
          description: Bind-mount and config-file path prefix remapping, e.g. {"from":"/srv/app","to":"/srv/app-restored"}.
          items:
            $ref: "#/components/schemas/PathRemap"
          type:
            - array
            - "null"
        reason:
          description: Mandatory for production restores (a change ticket such as INC-48391 is fine). Stored in the audit log.
          maxLength: 500
          type: string
        target_host_id:
          description: "Host to restore to (default: the host the recovery point was captured on)."
          format: uuid
          type: string
      type: object
    StatusBody:
      additionalProperties: false
      properties:
        checks:
          additionalProperties:
            type: string
          description: "Per-dependency result: ok or an error summary."
          type: object
        status:
          description: Overall status.
          enum:
            - ok
            - degraded
            - unavailable
          type: string
      required:
        - status
      type: object
    Test-notification-channelResponse:
      additionalProperties: false
      properties:
        delivered:
          type: boolean
        duration_ms:
          format: int64
          type: integer
        error:
          type: string
      required:
        - delivered
        - duration_ms
      type: object
    TmpfsUse:
      additionalProperties: false
      properties:
        container:
          type: string
        destination:
          type: string
      required:
        - container
        - destination
      type: object
    TokenCreateInputBody:
      additionalProperties: false
      properties:
        expires_in_days:
          default: 90
          description: 0 means no expiry.
          format: int64
          maximum: 365
          minimum: 0
          type: integer
        name:
          maxLength: 100
          minLength: 1
          type: string
      required:
        - name
      type: object
    TokenCreateOutputBody:
      additionalProperties: false
      properties:
        api_token:
          $ref: "#/components/schemas/APIToken"
        token:
          description: The token secret. Shown only once.
          type: string
      required:
        - token
        - api_token
      type: object
    TokenListOutputBody:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: "#/components/schemas/APIToken"
          type:
            - array
            - "null"
      required:
        - items
      type: object
    TotpEnrollOutputBody:
      additionalProperties: false
      properties:
        otpauth_url:
          description: otpauth:// URL for authenticator apps (render as a QR code).
          type: string
        secret:
          description: Base32 TOTP secret (shown once).
          type: string
      required:
        - secret
        - otpauth_url
      type: object
    Unprotected:
      additionalProperties: false
      properties:
        container:
          type: string
        files:
          format: int64
          type: integer
        path:
          type: string
        reason:
          type: string
        severity:
          type: string
      required:
        - container
        - path
        - files
        - severity
        - reason
      type: object
    Update-applicationRequest:
      additionalProperties: false
      properties:
        criticality:
          description: critical, high, medium or low
          type: string
        display_name:
          maxLength: 200
          type: string
        environment:
          description: production, staging, development, test or other
          type: string
        owner:
          maxLength: 200
          type: string
      type: object
    Update-notification-channelRequest:
      additionalProperties: false
      properties:
        config:
          $ref: "#/components/schemas/ChannelConfigDTO"
        enabled:
          type: boolean
        events:
          description: Event types to deliver (exact or prefix wildcard such as backup.*); empty or omitted = all.
          items:
            type: string
          maxItems: 100
          type:
            - array
            - "null"
        min_severity:
          default: warning
          enum:
            - info
            - warning
            - critical
          type: string
        name:
          maxLength: 100
          minLength: 1
          type: string
        secret:
          description: "Webhook signing secret (min. 16 characters). Requests then carry X-DBR2-Signature: sha256=<hex HMAC-SHA256(secret, X-DBR2-Timestamp + \".\" + body)>. On update: omit to keep, empty string to remove."
          maxLength: 500
          type: string
          writeOnly: true
      required:
        - enabled
        - name
        - config
      type: object
    Update-smtp-settingsRequest:
      additionalProperties: false
      properties:
        from:
          description: Sender address, e.g. DBR2 <dbr2@example.com>.
          maxLength: 320
          minLength: 3
          type: string
        host:
          maxLength: 253
          minLength: 1
          type: string
        password:
          maxLength: 500
          type: string
          writeOnly: true
        port:
          format: int64
          maximum: 65535
          minimum: 1
          type: integer
        tls:
          enum:
            - starttls
            - tls
            - none
          type: string
        username:
          maxLength: 200
          type: string
      required:
        - host
        - port
        - from
        - tls
      type: object
    User:
      additionalProperties: false
      properties:
        disabled:
          type: boolean
        display_name:
          type: string
        email:
          type:
            - string
            - "null"
        id:
          format: uuid
          type: string
        kind:
          enum:
            - master_admin
            - oidc
          type: string
        last_login_at:
          format: date-time
          type:
            - string
            - "null"
        roles:
          items:
            $ref: "#/components/schemas/RoleAssignment"
          type:
            - array
            - "null"
        username:
          type: string
      required:
        - id
        - kind
        - username
        - display_name
        - email
        - disabled
        - last_login_at
        - roles
      type: object
    UsersOutputBody:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: "#/components/schemas/User"
          type:
            - array
            - "null"
      required:
        - items
      type: object
    Verify-repositoryRequest:
      additionalProperties: false
      properties:
        read_percent:
          description: Default 10.
          format: double
          maximum: 100
          minimum: 0
          type: number
        recovery_point_id:
          description: Verify only this recovery point.
          type: string
      type: object
    VersionBody:
      additionalProperties: false
      properties:
        components:
          additionalProperties:
            type: string
          description: Version of every component, keyed by component name.
          type: object
        platform:
          description: DBR² platform version (MAJOR.MINOR.BUGFIX.BUILD).
          examples:
            - 0.1.0.0
          type: string
      required:
        - platform
        - components
      type: object
    Volume:
      additionalProperties: false
      properties:
        created_at:
          type: string
        driver:
          type: string
        labels:
          additionalProperties:
            type: string
          type: object
        mountpoint:
          type: string
        name:
          type: string
        options:
          additionalProperties:
            type: string
          type: object
        scope:
          type: string
      required:
        - name
        - driver
        - mountpoint
      type: object
    VolumeUse:
      additionalProperties: false
      properties:
        anonymous:
          type: boolean
        class:
          type: string
        driver:
          type: string
        external:
          type: boolean
        mountpoint:
          type: string
        name:
          type: string
        protected_by_default:
          type: boolean
        reasons:
          items:
            type: string
          type:
            - array
            - "null"
        used_by:
          items:
            type: string
          type:
            - array
            - "null"
      required:
        - name
        - driver
        - mountpoint
        - class
        - used_by
        - protected_by_default
      type: object
    WorkflowOutBody:
      additionalProperties: false
      properties:
        workflow_id:
          type: string
      required:
        - workflow_id
      type: object
  securitySchemes:
    bearerAuth:
      description: Personal API token (`dbr2pat_…`). Paste it into Authorize without the `Bearer ` prefix.
      scheme: bearer
      type: http
    sessionCookie:
      description: Browser session issued by the console login (master admin or Entra ID).
      in: cookie
      name: dbr2_session
      type: apiKey
info:
  description: |-
    Docker Backup, Recovery & Restore (DBR²) control-plane API.

    Authenticate with a personal API token (`dbr2pat_…`, created under /api/v1/tokens) in **Authorize**, or use your console session. Requests made from this page run with **your own** permissions; each operation lists the permission it needs in `x-dbr2-permission`.
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
  title: DBR² API
  version: 0.1.0.0
openapi: 3.1.0
paths:
  /api/v1/agents:
    get:
      description: |-
        Lists every enrolled host agent with its status, versions, health and live connection state.

        Requires permission `host.read`.
      operationId: list-agents
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/List-agentsResponse"
          description: OK
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Unauthorized
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Forbidden
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Internal Server Error
      summary: List agents
      tags:
        - Hosts
      x-dbr2-permission: host.read
  /api/v1/agents/registration-tokens:
    get:
      description: |-
        Lists agent registration tokens (secrets are never returned).

        Requires permission `host.manage`.
      operationId: list-registration-tokens
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/List-registration-tokensResponse"
          description: OK
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Unauthorized
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Forbidden
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Internal Server Error
      summary: List registration tokens
      tags:
        - Hosts
      x-dbr2-permission: host.manage
    post:
      description: |-
        Creates a single-use, expiring token for enrolling one host, and returns the join command (including the pinned CA fingerprint). The token is shown only once.

        Requires permission `host.manage`.
      operationId: create-registration-token
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Create-registration-tokenRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Create-registration-tokenResponse"
          description: Created
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Bad Request
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Unauthorized
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Forbidden
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Internal Server Error
      summary: Create a registration token
      tags:
        - Hosts
      x-dbr2-permission: host.manage
  /api/v1/agents/registration-tokens/{id}:
    delete:
      description: |-
        Revokes an unused registration token.

        Requires permission `host.manage`.
      operationId: revoke-registration-token
      parameters:
        - in: path
          name: id
          required: true
          schema:
            format: uuid
            type: string
      responses:
        "204":
          description: No Content
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Unauthorized
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Forbidden
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Not Found
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Internal Server Error
      summary: Revoke a registration token
      tags:
        - Hosts
      x-dbr2-permission: host.manage
  /api/v1/agents/{id}:
    get:
      description: |-
        Returns one agent.

        Requires permission `host.read`.
      operationId: get-agent
      parameters:
        - in: path
          name: id
          required: true
          schema:
            format: uuid
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentDTO"
          description: OK
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Unauthorized
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Forbidden
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Not Found
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Internal Server Error
      summary: Get an agent
      tags:
        - Hosts
      x-dbr2-permission: host.read
  /api/v1/agents/{id}/approve:
    post:
      description: |-
        Host approval workflow: a newly enrolled agent stays pending (its sessions are refused) until approved.

        Requires permission `host.manage`.
      operationId: approve-agent
      parameters:
        - in: path
          name: id
          required: true
          schema:
            format: uuid
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReasonInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentDTO"
          description: OK
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Unauthorized
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Forbidden
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Not Found
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Conflict
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Internal Server Error
      summary: Approve an agent
      tags:
        - Hosts
      x-dbr2-permission: host.manage
  /api/v1/agents/{id}/discover:
    post:
      description: |-
        Starts the DiscoverHost workflow; the agent's inventory and applications update when it completes. Agents also report their inventory periodically.

        Requires permission `host.manage`.
      operationId: discover-agent
      parameters:
        - in: path
          name: id
          required: true
          schema:
            format: uuid
            type: string
      responses:
        "202":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Discover-agentResponse"
          description: Accepted
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Unauthorized
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Forbidden
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Not Found
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Conflict
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Internal Server Error
      summary: Run discovery now
      tags:
        - Hosts
      x-dbr2-permission: host.manage
  /api/v1/agents/{id}/inventory:
    get:
      description: |-
        Returns the latest discovery inventory of the host (containers, volumes, networks, images, Compose files). Sensitive values are masked.

        Requires permission `host.read`.
      operationId: get-agent-inventory
      parameters:
        - in: path
          name: id
          required: true
          schema:
            format: uuid
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Get-agent-inventoryResponse"
          description: OK
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Unauthorized
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Forbidden
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Not Found
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Conflict
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Internal Server Error
      summary: Get a host's inventory
      tags:
        - Hosts
      x-dbr2-permission: host.read
  /api/v1/agents/{id}/resume:
    post:
      description: |-
        Allows a suspended agent to connect again.

        Requires permission `host.manage`.
      operationId: resume-agent
      parameters:
        - in: path
          name: id
          required: true
          schema:
            format: uuid
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReasonInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentDTO"
          description: OK
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Unauthorized
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Forbidden
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Not Found
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Conflict
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Internal Server Error
      summary: Resume an agent
      tags:
        - Hosts
      x-dbr2-permission: host.manage
  /api/v1/agents/{id}/revoke:
    post:
      description: |-
        Permanently revokes the agent and all of its certificates. The host must enroll again with a new token.

        Requires permission `host.manage`.
      operationId: revoke-agent
      parameters:
        - in: path
          name: id
          required: true
          schema:
            format: uuid
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReasonInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentDTO"
          description: OK
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Unauthorized
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Forbidden
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Not Found
        "409":
          content:
            application/problem+json:
