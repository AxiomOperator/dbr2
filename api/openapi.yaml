components:
  schemas:
    APIToken:
      additionalProperties: false
      properties:
        created_at:
          format: date-time
          type: string
        expires_at:
          format: date-time
          type:
            - string
            - "null"
        id:
          format: uuid
          type: string
        last_used_at:
          format: date-time
          type:
            - string
            - "null"
        name:
          type: string
        prefix:
          description: First characters of the token, for identification.
          type: string
        revoked_at:
          format: date-time
          type:
            - string
            - "null"
      required:
        - id
        - name
        - prefix
        - created_at
        - expires_at
        - last_used_at
        - revoked_at
      type: object
    AgentDTO:
      additionalProperties: false
      properties:
        agent_version:
          type: string
        approved_at:
          format: date-time
          type:
            - string
            - "null"
        architecture:
          type:
            - string
            - "null"
        certificate_not_after:
          format: date-time
          type:
            - string
            - "null"
        connected:
          description: The agent has a live gateway session.
          type: boolean
        docker_reachable:
          type:
            - boolean
            - "null"
        docker_version:
          type:
            - string
            - "null"
        enrolled_at:
          format: date-time
          type: string
        health_error:
          type:
            - string
            - "null"
        hostname:
          type: string
        id:
          format: uuid
          type: string
        last_seen_at:
          format: date-time
          type:
            - string
            - "null"
        latency_ms:
          format: int32
          type:
            - integer
            - "null"
        os_release:
          type:
            - string
            - "null"
        outdated:
          description: Older than the agent version this server ships.
          type: boolean
        protocol_version:
          type: string
        status:
          enum:
            - pending
            - active
            - suspended
            - revoked
          type: string
        status_reason:
          type:
            - string
            - "null"
      required:
        - id
        - hostname
        - status
        - status_reason
        - connected
        - outdated
        - agent_version
        - protocol_version
        - os_release
        - architecture
        - enrolled_at
        - approved_at
        - last_seen_at
        - latency_ms
        - docker_reachable
        - docker_version
        - health_error
        - certificate_not_after
      type: object
    Application:
      additionalProperties: false
      properties:
        bind_mounts:
          items:
            $ref: "#/components/schemas/BindUse"
          type:
            - array
            - "null"
        compose_project:
          type: string
        containers:
          items:
            type: string
          type:
            - array
            - "null"
        dependencies:
          items:
            $ref: "#/components/schemas/Dependency"
          type:
            - array
            - "null"
        images:
          items:
            $ref: "#/components/schemas/ImageRef"
          type:
            - array
            - "null"
        key:
          type: string
        kind:
          type: string
        name:
          type: string
        networks:
          items:
            $ref: "#/components/schemas/NetworkUse"
          type:
            - array
            - "null"
        secrets_count:
          format: int64
          type: integer
        services:
          items:
            $ref: "#/components/schemas/Service"
          type:
            - array
            - "null"
        source:
          type: string
        source_reason:
          type: string
        tmpfs:
          items:
            $ref: "#/components/schemas/TmpfsUse"
          type:
            - array
            - "null"
        unprotected:
          items:
            $ref: "#/components/schemas/Unprotected"
          type:
            - array
            - "null"
        volumes:
          items:
            $ref: "#/components/schemas/VolumeUse"
          type:
            - array
            - "null"
        working_dir:
          type: string
      required:
        - key
        - kind
        - name
        - source
        - services
        - volumes
        - bind_mounts
        - tmpfs
        - networks
        - images
        - dependencies
        - unprotected
        - secrets_count
        - containers
      type: object
    ApplicationDetail:
      additionalProperties: false
      properties:
        analysis:
          $ref: "#/components/schemas/Application"
          description: Services, volumes (with classification), bind mounts, networks, images (digest and platform), dependencies and unprotected paths. Null when the application is missing from the latest inventory.
        bind_mounts:
          format: int64
          type: integer
        collected_at:
          format: date-time
          type:
            - string
            - "null"
        containers:
          format: int64
          type: integer
        containers_detail:
          items:
            $ref: "#/components/schemas/ContainerDTO"
          type:
            - array
            - "null"
        criticality:
          type:
            - string
            - "null"
        dependencies:
          format: int64
          type: integer
        display_name:
          type:
            - string
            - "null"
        environment:
          type:
            - string
            - "null"
        host_id:
          format: uuid
          type: string
        hostname:
          type: string
        id:
          format: uuid
          type: string
        kind:
          enum:
            - compose
            - container
            - manual
          type: string
        last_seen_at:
          format: date-time
          type: string
        manual_containers:
          items:
            type: string
          type:
            - array
            - "null"
        missing_since:
          description: Set when the application disappeared from the host's latest inventory.
          format: date-time
          type:
            - string
            - "null"
        name:
          type: string
        owner:
          type:
            - string
            - "null"
        secrets_count:
          format: int64
          type: integer
        services:
          format: int64
          type: integer
        source:
          description: Provenance of the Compose definition.
          enum:
            - original
            - reconstructed
            - unknown
          type: string
        unprotected_high:
          description: Writable paths not backed by a volume or bind mount (high severity).
          format: int64
          type: integer
        volumes:
          format: int64
          type: integer
      required:
        - analysis
        - containers_detail
        - collected_at
        - id
        - name
        - display_name
        - kind
        - host_id
        - hostname
        - source
        - services
        - containers
        - volumes
        - bind_mounts
        - unprotected_high
        - dependencies
        - secrets_count
        - owner
        - environment
        - criticality
        - last_seen_at
        - missing_since
      type: object
    ApplicationSummary:
      additionalProperties: false
      properties:
        bind_mounts:
          format: int64
          type: integer
        containers:
          format: int64
          type: integer
        criticality:
          type:
            - string
            - "null"
        dependencies:
          format: int64
          type: integer
        display_name:
          type:
            - string
            - "null"
        environment:
          type:
            - string
            - "null"
        host_id:
          format: uuid
          type: string
        hostname:
          type: string
        id:
          format: uuid
          type: string
        kind:
          enum:
            - compose
            - container
            - manual
          type: string
        last_seen_at:
          format: date-time
          type: string
        missing_since:
          description: Set when the application disappeared from the host's latest inventory.
          format: date-time
          type:
            - string
            - "null"
        name:
          type: string
        owner:
          type:
            - string
            - "null"
        secrets_count:
          format: int64
          type: integer
        services:
          format: int64
          type: integer
        source:
          description: Provenance of the Compose definition.
          enum:
            - original
            - reconstructed
            - unknown
          type: string
        unprotected_high:
          description: Writable paths not backed by a volume or bind mount (high severity).
          format: int64
          type: integer
        volumes:
          format: int64
          type: integer
      required:
        - id
        - name
        - display_name
        - kind
        - host_id
        - hostname
        - source
        - services
        - containers
        - volumes
        - bind_mounts
        - unprotected_high
        - dependencies
        - secrets_count
        - owner
        - environment
        - criticality
        - last_seen_at
        - missing_since
      type: object
    AuditEvent:
      additionalProperties: false
      properties:
        actor_display:
          type: string
        actor_kind:
          enum:
            - user
            - system
            - anonymous
          type: string
        after: {}
        before: {}
        details: {}
        event_id:
          format: uuid
          type: string
        event_type:
          description: Stable event identifier.
          examples:
            - auth.login.succeeded
          type: string
        occurred_at:
          format: date-time
          type: string
        reason:
          type:
            - string
            - "null"
        request_id:
          type:
            - string
            - "null"
        result:
          enum:
            - success
            - failure
            - denied
          type: string
        source_ip:
          type:
            - string
            - "null"
        target_id:
          type:
            - string
            - "null"
        target_type:
          type:
            - string
            - "null"
        trace_id:
          type:
            - string
            - "null"
      required:
        - event_id
        - occurred_at
        - event_type
        - actor_display
        - actor_kind
        - source_ip
        - target_type
        - target_id
        - result
        - reason
        - details
        - request_id
        - trace_id
      type: object
    AuditListOutputBody:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: "#/components/schemas/AuditEvent"
          type:
            - array
            - "null"
        next_cursor:
          type:
            - string
            - "null"
      required:
        - items
        - next_cursor
      type: object
    BindUse:
      additionalProperties: false
      properties:
        container:
          type: string
        destination:
          type: string
        rw:
          type: boolean
        source:
          type: string
      required:
        - container
        - source
        - destination
        - rw
      type: object
    Change:
      additionalProperties: false
      properties:
        kind:
          type: string
        path:
          type: string
      required:
        - path
        - kind
      type: object
    CodeInputBody:
      additionalProperties: false
      properties:
        code:
          pattern: ^[0-9]{6}$
          type: string
      required:
        - code
      type: object
    ComposeDTO:
      additionalProperties: false
      properties:
        config_files:
          items:
            $ref: "#/components/schemas/FileDTO"
          type:
            - array
            - "null"
        env_files:
          items:
            $ref: "#/components/schemas/FileDTO"
          type:
            - array
            - "null"
        reason:
          type: string
        reconstructed:
          description: Generated Compose YAML (flagged RECONSTRUCTED; secrets as ${VAR} placeholders).
          type: string
        revealed:
          type: boolean
        secrets:
          additionalProperties:
            type: string
          description: Placeholder values; present only when revealed.
          type: object
        source:
          enum:
            - original
            - reconstructed
          type: string
      required:
        - source
        - config_files
        - env_files
        - revealed
      type: object
    ComposeProject:
      additionalProperties: false
      properties:
        config_files:
          items:
            $ref: "#/components/schemas/File"
          type:
            - array
            - "null"
        env_files:
          items:
            $ref: "#/components/schemas/File"
          type:
            - array
            - "null"
        errors:
          items:
            type: string
          type:
            - array
            - "null"
        name:
          type: string
        working_dir:
          type: string
      required:
        - name
        - working_dir
      type: object
    Container:
      additionalProperties: false
      properties:
        changes:
          items:
            $ref: "#/components/schemas/Change"
          type:
            - array
            - "null"
        changes_error:
          type: string
        changes_truncated:
          type: boolean
        cmd:
          items:
            type: string
          type:
            - array
            - "null"
        created:
          format: date-time
          type: string
        entrypoint:
          items:
            type: string
          type:
            - array
            - "null"
        env:
          items:
            $ref: "#/components/schemas/EnvVar"
          type:
            - array
            - "null"
        id:
          type: string
        image:
          type: string
        image_id:
          type: string
        labels:
          additionalProperties:
            type: string
          type: object
        mounts:
          items:
            $ref: "#/components/schemas/Mount"
          type:
            - array
            - "null"
        name:
          type: string
        network_mode:
          type: string
        networks:
          items:
            type: string
          type:
            - array
            - "null"
        ports:
          items:
            $ref: "#/components/schemas/Port"
          type:
            - array
            - "null"
        read_only_rootfs:
          type: boolean
        restart_policy:
          type: string
        state:
          type: string
        tmpfs:
          additionalProperties:
            type: string
          type: object
        user:
          type: string
        working_dir:
          type: string
      required:
        - id
        - name
        - image
        - image_id
        - state
        - created
      type: object
    ContainerDTO:
      additionalProperties: false
      properties:
        env:
          items:
            $ref: "#/components/schemas/EnvVar"
          type:
            - array
            - "null"
        id:
          type: string
        image:
          type: string
        mounts:
          items:
            $ref: "#/components/schemas/Mount"
          type:
            - array
            - "null"
        name:
          type: string
        networks:
          items:
            type: string
          type:
            - array
            - "null"
        ports:
          items:
            $ref: "#/components/schemas/Port"
          type:
            - array
            - "null"
        state:
          type: string
      required:
        - id
        - name
        - image
        - state
        - env
        - ports
        - mounts
        - networks
      type: object
    ContainerRef:
      additionalProperties: false
      properties:
        id:
          type: string
        name:
          type: string
        state:
          type: string
      required:
        - id
        - name
        - state
      type: object
    Cookie:
      additionalProperties: false
      properties:
        Domain:
          type: string
        Expires:
          format: date-time
          type: string
        HttpOnly:
          type: boolean
        MaxAge:
          format: int64
          type: integer
        Name:
          type: string
        Partitioned:
          type: boolean
        Path:
          type: string
        Quoted:
          type: boolean
        Raw:
          type: string
        RawExpires:
          type: string
        SameSite:
          format: int64
          type: integer
        Secure:
          type: boolean
        Unparsed:
          items:
            type: string
          type:
            - array
            - "null"
        Value:
          type: string
      required:
        - Name
        - Value
        - Quoted
        - Path
        - Domain
        - Expires
        - RawExpires
        - MaxAge
        - Secure
        - HttpOnly
        - SameSite
        - Partitioned
        - Raw
        - Unparsed
      type: object
    Create-applicationRequest:
      additionalProperties: false
      properties:
        containers:
          items:
            type: string
          minItems: 1
          type:
            - array
            - "null"
        host_id:
          format: uuid
          type: string
        name:
          maxLength: 200
          minLength: 1
          type: string
      required:
        - name
        - host_id
        - containers
      type: object
    Create-applicationResponse:
      additionalProperties: false
      properties:
        id:
          type: string
      required:
        - id
      type: object
    Create-registration-tokenRequest:
      additionalProperties: false
      properties:
        description:
          maxLength: 200
          minLength: 1
          type: string
        expires_in_hours:
          default: 24
          format: int64
          maximum: 168
          minimum: 1
          type: integer
      required:
        - description
      type: object
    Create-registration-tokenResponse:
      additionalProperties: false
      properties:
        ca_sha256:
          description: SHA-256 fingerprint of the DBR² agent CA, pinned by the agent at enrollment.
          type: string
        gateway_address:
          type: string
        join_command:
          type: string
        registration_token:
          $ref: "#/components/schemas/RegistrationTokenDTO"
        token:
          description: Shown only once.
          type: string
      required:
        - token
        - gateway_address
        - ca_sha256
        - join_command
        - registration_token
      type: object
    Dependency:
      additionalProperties: false
      properties:
        detail:
          type: string
        kind:
          type: string
        name:
          type: string
      required:
        - kind
        - name
        - detail
      type: object
    Discover-agentResponse:
      additionalProperties: false
      properties:
        workflow_id:
          type: string
      required:
        - workflow_id
      type: object
    EnvVar:
      additionalProperties: false
      properties:
        key:
          type: string
        sealed:
          contentEncoding: base64
          type: string
        sensitive:
          type: boolean
        value:
          type: string
      required:
        - key
      type: object
    ErrorDetail:
      additionalProperties: false
      properties:
        location:
          description: Where the error occurred, e.g. 'body.items[3].tags' or 'path.thing-id'
          type: string
        message:
          description: Error message text
          type: string
        value:
          description: The value at the given location
      type: object
    File:
      additionalProperties: false
      properties:
        content:
          type: string
        error:
          type: string
        masked:
          type: boolean
        path:
          type: string
        sealed:
          contentEncoding: base64
          type: string
        size:
          format: int64
          type: integer
        truncated:
          type: boolean
      required:
        - path
        - size
      type: object
    FileDTO:
      additionalProperties: false
      properties:
        content:
          type: string
        error:
          type: string
        masked:
          description: Sensitive values are replaced by ********.
          type: boolean
        path:
          type: string
      required:
        - path
        - content
        - masked
      type: object
    Get-agent-inventoryResponse:
      additionalProperties: false
      properties:
        inventory:
          $ref: "#/components/schemas/Inventory"
        received_at:
          format: date-time
          type: string
      required:
        - received_at
        - inventory
      type: object
    GroupMapping:
      additionalProperties: false
      properties:
        group_id:
          description: Entra ID group object ID.
          maxLength: 256
          minLength: 1
          type: string
        provider:
          examples:
            - entra
          type: string
        role:
          examples:
            - auditor
          type: string
      required:
        - provider
        - group_id
        - role
      type: object
    Host:
      additionalProperties: false
      properties:
        api_version:
          type: string
        architecture:
          type: string
        cgroup_version:
          type: string
        cpus:
          format: int64
          type: integer
        engine_version:
          type: string
        hostname:
          type: string
        kernel_version:
          type: string
        memory_bytes:
          format: int64
          type: integer
        operating_system:
          type: string
        os_type:
          type: string
        root_dir:
          type: string
        rootless:
          type: boolean
        runtime:
          type: string
        security_options:
          items:
            type: string
          type:
            - array
            - "null"
        selinux:
          type: boolean
        storage_driver:
          type: string
      required:
        - hostname
        - operating_system
        - os_type
        - kernel_version
        - architecture
        - runtime
        - engine_version
        - api_version
        - root_dir
        - storage_driver
        - cgroup_version
        - rootless
        - selinux
        - cpus
        - memory_bytes
      type: object
    Image:
      additionalProperties: false
      properties:
        architecture:
          type: string
        id:
          type: string
        os:
          type: string
        repo_digests:
          items:
            type: string
          type:
            - array
            - "null"
        repo_tags:
          items:
            type: string
          type:
            - array
            - "null"
        size:
          format: int64
          type: integer
        variant:
          type: string
      required:
        - id
        - os
        - architecture
        - size
      type: object
    ImageRef:
      additionalProperties: false
      properties:
        digests:
          items:
            type: string
          type:
            - array
            - "null"
        image_id:
          type: string
        platform:
          type: string
        reference:
          type: string
      required:
        - reference
        - image_id
      type: object
    Inventory:
      additionalProperties: false
      properties:
        collected_at:
          format: date-time
          type: string
        compose_projects:
          items:
            $ref: "#/components/schemas/ComposeProject"
          type:
            - array
            - "null"
        containers:
          items:
            $ref: "#/components/schemas/Container"
          type:
            - array
            - "null"
        host:
          $ref: "#/components/schemas/Host"
        images:
          items:
            $ref: "#/components/schemas/Image"
          type:
            - array
            - "null"
        networks:
          items:
            $ref: "#/components/schemas/Network"
          type:
            - array
            - "null"
        schema_version:
          format: int64
          type: integer
        volumes:
          items:
            $ref: "#/components/schemas/Volume"
          type:
            - array
            - "null"
        warnings:
          items:
            type: string
          type:
            - array
            - "null"
      required:
        - schema_version
        - collected_at
        - host
        - containers
        - volumes
        - networks
        - images
        - compose_projects
      type: object
    List-agentsResponse:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: "#/components/schemas/AgentDTO"
          type:
            - array
            - "null"
      required:
        - items
      type: object
    List-applicationsResponse:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: "#/components/schemas/ApplicationSummary"
          type:
            - array
            - "null"
      required:
        - items
      type: object
    List-registration-tokensResponse:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: "#/components/schemas/RegistrationTokenDTO"
          type:
            - array
            - "null"
      required:
        - items
      type: object
    LoginInputBody:
      additionalProperties: false
      properties:
        password:
          maxLength: 1024
          minLength: 1
          type: string
        totp_code:
          description: Required when TOTP is enabled (the first attempt returns code totp_required).
          pattern: ^[0-9]{6}$
          type: string
        username:
          maxLength: 256
          minLength: 1
          type: string
      required:
        - username
        - password
      type: object
    LoginOutputBody:
      additionalProperties: false
      properties:
        user:
          $ref: "#/components/schemas/Me"
      required:
        - user
      type: object
    MappingsOutputBody:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: "#/components/schemas/GroupMapping"
          type:
            - array
            - "null"
      required:
        - items
      type: object
    Me:
      additionalProperties: false
      properties:
        display_name:
          type: string
        email:
          description: Email address, if known.
          type:
            - string
            - "null"
        id:
          format: uuid
          type: string
        kind:
          enum:
            - master_admin
            - oidc
          type: string
        permissions:
          items:
            type: string
          type:
            - array
            - "null"
        roles:
          items:
            type: string
          type:
            - array
            - "null"
        totp_enabled:
          type: boolean
        username:
          type: string
      required:
        - id
        - username
        - display_name
        - email
        - kind
        - roles
        - permissions
        - totp_enabled
      type: object
    Mount:
      additionalProperties: false
      properties:
        destination:
          type: string
        driver:
          type: string
        mode:
          type: string
        name:
          type: string
        propagation:
          type: string
        rw:
          type: boolean
        source:
          type: string
        type:
          type: string
      required:
        - type
        - destination
        - rw
      type: object
    Network:
      additionalProperties: false
      properties:
        attachable:
          type: boolean
        driver:
          type: string
        id:
          type: string
        internal:
          type: boolean
        labels:
          additionalProperties:
            type: string
          type: object
        name:
          type: string
        scope:
          type: string
      required:
        - id
        - name
        - driver
      type: object
    NetworkUse:
      additionalProperties: false
      properties:
        driver:
          type: string
        external:
          type: boolean
        name:
          type: string
      required:
        - name
        - driver
      type: object
    PasswordInputBody:
      additionalProperties: false
      properties:
        current_password:
          maxLength: 1024
          minLength: 1
          type: string
        new_password:
          maxLength: 1024
          minLength: 1
          type: string
      required:
        - current_password
        - new_password
      type: object
    Port:
      additionalProperties: false
      properties:
        container_port:
          type: string
        host_ip:
          type: string
        host_port:
          type: string
        protocol:
          type: string
      required:
        - container_port
        - protocol
      type: object
    Problem:
      additionalProperties: false
      properties:
        code:
          description: Stable machine-readable error code.
          examples:
            - invalid_credentials
          type: string
        detail:
          description: Explanation specific to this occurrence.
          examples:
            - invalid username or password
          type: string
        errors:
          description: Individual validation errors.
          items:
            $ref: "#/components/schemas/ErrorDetail"
          type:
            - array
            - "null"
        status:
          description: HTTP status code.
          examples:
            - 401
          format: int64
          type: integer
        title:
          description: Short summary of the problem type.
          examples:
            - Unauthorized
          type: string
      required:
        - title
        - status
      type: object
    ProviderInfo:
      additionalProperties: false
      properties:
        display_name:
          examples:
            - Microsoft Entra ID
          type: string
        id:
          examples:
            - entra
          type: string
        login_url:
          examples:
            - /api/v1/auth/oidc/entra/login
          type: string
      required:
        - id
        - display_name
        - login_url
      type: object
    ProvidersOutputBody:
      additionalProperties: false
      properties:
        master_admin:
          description: The local master admin sign-in is always available.
          type: boolean
        oidc:
          items:
            $ref: "#/components/schemas/ProviderInfo"
          type:
            - array
            - "null"
      required:
        - master_admin
        - oidc
      type: object
    ReasonInputBody:
      additionalProperties: false
      properties:
        reason:
          description: Stored in the audit log.
          maxLength: 500
          minLength: 1
          type: string
      required:
        - reason
      type: object
    RegistrationTokenDTO:
      additionalProperties: false
      properties:
        created_at:
          format: date-time
          type: string
        description:
          type: string
        expires_at:
          format: date-time
          type: string
        id:
          format: uuid
          type: string
        prefix:
          type: string
        revoked_at:
          format: date-time
          type:
            - string
            - "null"
        used_at:
          format: date-time
          type:
            - string
            - "null"
        used_by_agent:
          type:
            - string
            - "null"
      required:
        - id
        - prefix
        - description
        - created_at
        - expires_at
        - used_at
        - used_by_agent
        - revoked_at
      type: object
    Role:
      additionalProperties: false
      properties:
        description:
          type: string
        display_name:
          type: string
        permissions:
          items:
            type: string
          type:
            - array
            - "null"
        role:
          type: string
      required:
        - role
        - display_name
        - description
        - permissions
      type: object
    RoleAssignment:
      additionalProperties: false
      properties:
        role:
          examples:
            - backup_administrator
          type: string
        source:
          description: manual grants, Entra ID group mapping, or the implicit master admin role.
          enum:
            - manual
            - oidc_group
            - master_admin
          type: string
      required:
        - role
        - source
      type: object
    RolesOutputBody:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: "#/components/schemas/Role"
          type:
            - array
            - "null"
      required:
        - items
      type: object
    Service:
      additionalProperties: false
      properties:
        containers:
          items:
            $ref: "#/components/schemas/ContainerRef"
          type:
            - array
            - "null"
        image:
          type: string
        name:
          type: string
      required:
        - name
        - image
        - containers
      type: object
    SetRolesInputBody:
      additionalProperties: false
      properties:
        reason:
          description: Why the change is made (stored in the audit log).
          maxLength: 500
          minLength: 1
          type: string
        roles:
          description: Complete list of manually granted roles (group-mapped roles are managed by Entra ID).
          items:
            type: string
          type:
            - array
            - "null"
      required:
        - roles
        - reason
      type: object
    SetStatusInputBody:
      additionalProperties: false
      properties:
        disabled:
          type: boolean
        reason:
          maxLength: 500
          minLength: 1
          type: string
      required:
        - disabled
        - reason
      type: object
    StatusBody:
      additionalProperties: false
      properties:
        checks:
          additionalProperties:
            type: string
          description: "Per-dependency result: ok or an error summary."
          type: object
        status:
          description: Overall status.
          enum:
            - ok
            - degraded
            - unavailable
          type: string
      required:
        - status
      type: object
    TmpfsUse:
      additionalProperties: false
      properties:
        container:
          type: string
        destination:
          type: string
      required:
        - container
        - destination
      type: object
    TokenCreateInputBody:
      additionalProperties: false
      properties:
        expires_in_days:
          default: 90
          description: 0 means no expiry.
          format: int64
          maximum: 365
          minimum: 0
          type: integer
        name:
          maxLength: 100
          minLength: 1
          type: string
      required:
        - name
      type: object
    TokenCreateOutputBody:
      additionalProperties: false
      properties:
        api_token:
          $ref: "#/components/schemas/APIToken"
        token:
          description: The token secret. Shown only once.
          type: string
      required:
        - token
        - api_token
      type: object
    TokenListOutputBody:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: "#/components/schemas/APIToken"
          type:
            - array
            - "null"
      required:
        - items
      type: object
    TotpEnrollOutputBody:
      additionalProperties: false
      properties:
        otpauth_url:
          description: otpauth:// URL for authenticator apps (render as a QR code).
          type: string
        secret:
          description: Base32 TOTP secret (shown once).
          type: string
      required:
        - secret
        - otpauth_url
      type: object
    Unprotected:
      additionalProperties: false
      properties:
        container:
          type: string
        files:
          format: int64
          type: integer
        path:
          type: string
        reason:
          type: string
        severity:
          type: string
      required:
        - container
        - path
        - files
        - severity
        - reason
      type: object
    Update-applicationRequest:
      additionalProperties: false
      properties:
        criticality:
          description: critical, high, medium or low
          type: string
        display_name:
          maxLength: 200
          type: string
        environment:
          description: production, staging, development, test or other
          type: string
        owner:
          maxLength: 200
          type: string
      type: object
    User:
      additionalProperties: false
      properties:
        disabled:
          type: boolean
        display_name:
          type: string
        email:
          type:
            - string
            - "null"
        id:
          format: uuid
          type: string
        kind:
          enum:
            - master_admin
            - oidc
          type: string
        last_login_at:
          format: date-time
          type:
            - string
            - "null"
        roles:
          items:
            $ref: "#/components/schemas/RoleAssignment"
          type:
            - array
            - "null"
        username:
          type: string
      required:
        - id
        - kind
        - username
        - display_name
        - email
        - disabled
        - last_login_at
        - roles
      type: object
    UsersOutputBody:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: "#/components/schemas/User"
          type:
            - array
            - "null"
      required:
        - items
      type: object
    VersionBody:
      additionalProperties: false
      properties:
        components:
          additionalProperties:
            type: string
          description: Version of every component, keyed by component name.
          type: object
        platform:
          description: DBR² platform version (MAJOR.MINOR.BUGFIX.BUILD).
          examples:
            - 0.1.0.0
          type: string
      required:
        - platform
        - components
      type: object
    Volume:
      additionalProperties: false
      properties:
        created_at:
          type: string
        driver:
          type: string
        labels:
          additionalProperties:
            type: string
          type: object
        mountpoint:
          type: string
        name:
          type: string
        options:
          additionalProperties:
            type: string
          type: object
        scope:
          type: string
      required:
        - name
        - driver
        - mountpoint
      type: object
    VolumeUse:
      additionalProperties: false
      properties:
        anonymous:
          type: boolean
        class:
          type: string
        driver:
          type: string
        external:
          type: boolean
        mountpoint:
          type: string
        name:
          type: string
        protected_by_default:
          type: boolean
        reasons:
          items:
            type: string
          type:
            - array
            - "null"
        used_by:
          items:
            type: string
          type:
            - array
            - "null"
      required:
        - name
        - driver
        - mountpoint
        - class
        - used_by
        - protected_by_default
      type: object
  securitySchemes:
    bearerAuth:
      description: Personal API token (`dbr2pat_…`). Paste it into Authorize without the `Bearer ` prefix.
      scheme: bearer
      type: http
    sessionCookie:
      description: Browser session issued by the console login (master admin or Entra ID).
      in: cookie
      name: dbr2_session
      type: apiKey
info:
  description: |-
    Docker Backup, Recovery & Restore (DBR²) control-plane API.

    Authenticate with a personal API token (`dbr2pat_…`, created under /api/v1/tokens) in **Authorize**, or use your console session. Requests made from this page run with **your own** permissions; each operation lists the permission it needs in `x-dbr2-permission`.
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
  title: DBR² API
  version: 0.1.0.0
openapi: 3.1.0
paths:
  /api/v1/agents:
    get:
      description: |-
        Lists every enrolled host agent with its status, versions, health and live connection state.

        Requires permission `host.read`.
      operationId: list-agents
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/List-agentsResponse"
          description: OK
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Unauthorized
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Forbidden
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Internal Server Error
      summary: List agents
      tags:
        - Hosts
      x-dbr2-permission: host.read
  /api/v1/agents/registration-tokens:
    get:
      description: |-
        Lists agent registration tokens (secrets are never returned).

        Requires permission `host.manage`.
      operationId: list-registration-tokens
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/List-registration-tokensResponse"
          description: OK
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Unauthorized
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Forbidden
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Internal Server Error
      summary: List registration tokens
      tags:
        - Hosts
      x-dbr2-permission: host.manage
    post:
      description: |-
        Creates a single-use, expiring token for enrolling one host, and returns the join command (including the pinned CA fingerprint). The token is shown only once.

        Requires permission `host.manage`.
      operationId: create-registration-token
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Create-registration-tokenRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Create-registration-tokenResponse"
          description: Created
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Bad Request
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Unauthorized
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Forbidden
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Internal Server Error
      summary: Create a registration token
      tags:
        - Hosts
      x-dbr2-permission: host.manage
  /api/v1/agents/registration-tokens/{id}:
    delete:
      description: |-
        Revokes an unused registration token.

        Requires permission `host.manage`.
      operationId: revoke-registration-token
      parameters:
        - in: path
          name: id
          required: true
          schema:
            format: uuid
            type: string
      responses:
        "204":
          description: No Content
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Unauthorized
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Forbidden
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Not Found
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Internal Server Error
      summary: Revoke a registration token
      tags:
        - Hosts
      x-dbr2-permission: host.manage
  /api/v1/agents/{id}:
    get:
      description: |-
        Returns one agent.

        Requires permission `host.read`.
      operationId: get-agent
      parameters:
        - in: path
          name: id
          required: true
          schema:
            format: uuid
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentDTO"
          description: OK
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Unauthorized
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Forbidden
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Not Found
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Internal Server Error
      summary: Get an agent
      tags:
        - Hosts
      x-dbr2-permission: host.read
  /api/v1/agents/{id}/approve:
    post:
      description: |-
        Host approval workflow: a newly enrolled agent stays pending (its sessions are refused) until approved.

        Requires permission `host.manage`.
      operationId: approve-agent
      parameters:
        - in: path
          name: id
          required: true
          schema:
            format: uuid
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReasonInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentDTO"
          description: OK
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Unauthorized
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Forbidden
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Not Found
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Conflict
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Internal Server Error
      summary: Approve an agent
      tags:
        - Hosts
      x-dbr2-permission: host.manage
  /api/v1/agents/{id}/discover:
    post:
      description: |-
        Starts the DiscoverHost workflow; the agent's inventory and applications update when it completes. Agents also report their inventory periodically.

        Requires permission `host.manage`.
      operationId: discover-agent
      parameters:
        - in: path
          name: id
          required: true
          schema:
            format: uuid
            type: string
      responses:
        "202":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Discover-agentResponse"
          description: Accepted
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Unauthorized
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Forbidden
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Not Found
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Conflict
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Internal Server Error
      summary: Run discovery now
      tags:
        - Hosts
      x-dbr2-permission: host.manage
  /api/v1/agents/{id}/inventory:
    get:
      description: |-
        Returns the latest discovery inventory of the host (containers, volumes, networks, images, Compose files). Sensitive values are masked.

        Requires permission `host.read`.
      operationId: get-agent-inventory
      parameters:
        - in: path
          name: id
          required: true
          schema:
            format: uuid
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Get-agent-inventoryResponse"
          description: OK
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Unauthorized
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Forbidden
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Not Found
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Conflict
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Internal Server Error
      summary: Get a host's inventory
      tags:
        - Hosts
      x-dbr2-permission: host.read
  /api/v1/agents/{id}/resume:
    post:
      description: |-
        Allows a suspended agent to connect again.

        Requires permission `host.manage`.
      operationId: resume-agent
      parameters:
        - in: path
          name: id
          required: true
          schema:
            format: uuid
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReasonInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentDTO"
          description: OK
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Unauthorized
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Forbidden
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Not Found
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Conflict
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Internal Server Error
      summary: Resume an agent
      tags:
        - Hosts
      x-dbr2-permission: host.manage
  /api/v1/agents/{id}/revoke:
    post:
      description: |-
        Permanently revokes the agent and all of its certificates. The host must enroll again with a new token.

        Requires permission `host.manage`.
      operationId: revoke-agent
      parameters:
        - in: path
          name: id
          required: true
          schema:
            format: uuid
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReasonInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentDTO"
          description: OK
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Unauthorized
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Forbidden
        "404":
          content:
            application/problem+json:
              schema:
