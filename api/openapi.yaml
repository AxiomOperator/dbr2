  /api/v1/settings/smtp:
    get:
      description: |-
        The SMTP relay used by email channels. The password is write-only (`password_set`).

        Requires permission `policy.read`.
      operationId: get-smtp-settings
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SMTPSettingsDTO"
          description: OK
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Unauthorized
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Forbidden
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Internal Server Error
      summary: Get the SMTP settings
      tags:
        - Settings
      x-dbr2-permission: policy.read
    put:
      description: |-
        Replaces the SMTP relay settings. `tls`: `starttls` (typically port 587), `tls` (implicit TLS, typically 465) or `none` (plain text; allowed only for a relay on localhost). PLAIN authentication is used when `username` is set. Omit `password` to keep the stored password, send an empty string to remove it. The password is sealed at rest and never returned. Audited.

        Requires permission `policy.manage`.
      operationId: update-smtp-settings
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Update-smtp-settingsRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SMTPSettingsDTO"
          description: OK
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Bad Request
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Unauthorized
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Forbidden
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Internal Server Error
      summary: Update the SMTP settings
      tags:
        - Settings
      x-dbr2-permission: policy.manage
